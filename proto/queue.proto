syntax = "proto3";

package dispatcher.v1;

option java_multiple_files = true;
option java_package = "cn.mapway.broker.proto";
option java_outer_classname = "QueueProto";

service MessageQueue {
  // Client streams publishes; server streams one response per request after SQLite commit.
  rpc AcceptMessages(stream AcceptMessageRequest) returns (stream AcceptMessageResponse);

  // Optional metadata about a consumer. Delivery is on Subscribe, not this call.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Unregister drops stored consumer metadata.
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);

  // Open a consume stream. Multiple subscribers on one topic compete:
  // each message is sent to exactly one of them.
  rpc Subscribe(SubscribeRequest) returns (stream SatwayMessage);

  // Confirm or reject a message received from Subscribe.
  rpc AckMessage(AckMessageRequest) returns (AckMessageResponse);

  // Create or replace delivery and persistence for many topics at once.
  // delivery is "single" (competing consumers) or "broadcast" (every live stream).
  // persistence is "persistent" (store and deliver later) or "ephemeral"
  // (deliver only to live Subscribe streams; drop if nobody is connected).
  // Topics never passed to ConfigureTopics default to broadcast + ephemeral.
  rpc ConfigureTopics(ConfigureTopicsRequest) returns (ConfigureTopicsResponse);

  // List stored topic delivery and persistence configs.
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
}

message AcceptMessageRequest {
  // Optional caller-provided idempotency key. Reusing it returns the original message id.
  string idempotency_key = 1;
  string topic = 2;
  bytes payload = 3;
  map<string, string> attributes = 4;
}

message AcceptMessageResponse {
  string message_id = 1;
  bool duplicate = 2;
}

message RegisterRequest {
  string topic = 1;
  // Optional. Pass the id from a previous Register to refresh the same consumer.
  string consumer_id = 2;
  // Display name and extra attributes. Not used for delivery.
  // Official SDKs also send `x-client-version` and `x-client-host` metadata;
  // the broker stores them as attributes["version"] / attributes["host"]
  // when the client does not set those keys.
  string name = 3;
  map<string, string> attributes = 4;
}

message RegisterResponse {
  string consumer_id = 1;
}

message UnregisterRequest {
  string consumer_id = 1;
}

message UnregisterResponse {}

message SubscribeRequest {
  string topic = 1;
  // Optional. Links this stream to a Register() consumer_id.
  string consumer_id = 2;
}

message SatwayMessage {
  string message_id = 1;
  string topic = 2;
  bytes payload = 3;
  map<string, string> attributes = 4;
  string created_at = 5;
  string lease = 6;
}

message AckMessageRequest {
  string message_id = 1;
  string lease = 2;
  bool success = 3;
  string error = 4;
}

message AckMessageResponse {
  bool accepted = 1;
}

message TopicConfig {
  string topic = 1;
  // "single" or "broadcast". Empty on configure is rejected.
  string delivery = 2;
  // "persistent" or "ephemeral". Empty on configure means persistent.
  string persistence = 3;
}

message ConfigureTopicsRequest {
  repeated TopicConfig topics = 1;
}

message ConfigureTopicsResponse {
  repeated TopicConfig topics = 1;
}

message ListTopicsRequest {}

message ListTopicsResponse {
  repeated TopicConfig topics = 1;
}

// CacheService is a SQLite-backed Redis replacement: string KV cache with TTL
// plus distributed locks. Values are binary-safe bytes; Incr treats the stored
// value as a signed integer.
service CacheService {
  rpc Set(CacheSetRequest) returns (CacheSetResponse);
  rpc Get(CacheGetRequest) returns (CacheGetResponse);
  rpc Delete(CacheDeleteRequest) returns (CacheDeleteResponse);
  rpc Incr(CacheIncrRequest) returns (CacheIncrResponse);
  rpc Expire(CacheExpireRequest) returns (CacheExpireResponse);
  rpc Ttl(CacheTtlRequest) returns (CacheTtlResponse);
  rpc AcquireLock(LockAcquireRequest) returns (LockAcquireResponse);
  rpc RenewLock(LockRenewRequest) returns (LockRenewResponse);
  rpc ReleaseLock(LockReleaseRequest) returns (LockReleaseResponse);
  rpc IsLocked(LockIsLockedRequest) returns (LockIsLockedResponse);
}

message CacheSetRequest {
  string key = 1;
  bytes value = 2;
  // Optional time-to-live in seconds. <= 0 means no expiry.
  int64 ttl_seconds = 3;
  // Optional type hint stored with the value: "string" (default), "long",
  // "int", "double", "bool". Clients may use it to restore a typed value.
  string value_type = 4;
}

message CacheSetResponse {
  bool ok = 1;
}

message CacheGetRequest {
  string key = 1;
}

message CacheGetResponse {
  bool found = 1;
  bytes value = 2;
  string value_type = 3;
}

message CacheDeleteRequest {
  string key = 1;
}

message CacheDeleteResponse {
  bool deleted = 1;
}

message CacheIncrRequest {
  string key = 1;
  int64 delta = 2;
  // TTL applied only when the key is created.
  int64 ttl_seconds = 3;
}

message CacheIncrResponse {
  int64 value = 1;
}

message CacheExpireRequest {
  string key = 1;
  int64 ttl_seconds = 2;
}

message CacheExpireResponse {
  bool ok = 1;
}

message CacheTtlRequest {
  string key = 1;
}

message CacheTtlResponse {
  // Redis semantics: -2 missing, -1 no expiry, >= 0 seconds remaining.
  int64 ttl_seconds = 1;
}

message LockAcquireRequest {
  string lock_key = 1;
  // Owner token (UUID). Release and renew must present the same owner.
  string owner = 2;
  // How long the lock may be held before it expires, in seconds. Must be > 0.
  int64 ttl_seconds = 3;
}

message LockAcquireResponse {
  bool acquired = 1;
}

message LockRenewRequest {
  string lock_key = 1;
  string owner = 2;
  int64 ttl_seconds = 3;
}

message LockRenewResponse {
  bool renewed = 1;
}

message LockReleaseRequest {
  string lock_key = 1;
  string owner = 2;
}

message LockReleaseResponse {
  bool released = 1;
}

message LockIsLockedRequest {
  string lock_key = 1;
}

message LockIsLockedResponse {
  bool locked = 1;
}
