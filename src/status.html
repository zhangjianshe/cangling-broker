<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>苍岭消息 · 运行状态</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2129;
      --line: #2a3440;
      --text: #e7ecf1;
      --muted: #8b98a5;
      --live: #3dd68c;
      --stale: #f0b429;
      --fail: #f07178;
      --pending: #59c2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0; }
    #build { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
    #meta { color: var(--muted); font-size: 13px; text-align: right; }
    #error {
      display: none;
      margin: 8px 24px;
      padding: 8px 12px;
      border: 1px solid var(--fail);
      color: var(--fail);
      border-radius: 6px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 10px;
      padding: 12px 24px 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .card .label { color: var(--muted); font-size: 12px; }
    .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    section { padding: 0 24px 24px; }
    h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    .empty { color: var(--muted); padding: 16px 24px; }
    .pill {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .live { background: #143d2c; color: var(--live); }
    .stale { background: #3d3114; color: var(--stale); }
    .consumer { color: var(--muted); font-size: 12px; margin: 2px 0; }
    .url { color: var(--text); word-break: break-all; }
    .fail { color: var(--fail); }
    .pending { color: var(--pending); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="48" height="48">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F2FE"></stop>
            <stop offset="100%" stop-color="#3b82f6"></stop>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="36" height="36" rx="10" fill="#1e293b" stroke="url(#logoGrad)" stroke-width="2"></rect>
        <path d="M 26 12 C 22 10 16 12 13 16 C 10 20 12 26 16 28 C 20 30 26 27 28 24" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round"></path>
        <circle cx="27" cy="14" r="3" fill="#00F2FE"></circle>
      </svg>
      <div>
        <h1>苍岭消息</h1>
        <div id="build">正在加载版本…</div>
      </div>
    </div>
    <div id="meta">正在加载…</div>
  </header>
  <div id="error"></div>
  <div class="cards" id="cards"></div>
  <section>
    <h2>主题</h2>
    <div id="topics"></div>
  </section>
  <script>
    const $ = (id) => document.getElementById(id);

    function fmtUptime(secs) {
      const s = Number(secs) || 0;
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h) return h + " 小时 " + m + " 分";
      if (m) return m + " 分 " + r + " 秒";
      return r + " 秒";
    }

    function card(label, value, cls) {
      return '<div class="card"><div class="label">' + label + '</div>' +
        '<div class="value' + (cls ? " " + cls : "") + '">' + value + "</div></div>";
    }

    function consumersHtml(list) {
      if (!list || !list.length) return '<div class="consumer">暂无消费者</div>';
      return list.map((c) => {
        const pill = c.live
          ? '<span class="pill live">在线</span>'
          : '<span class="pill stale">离线</span>';
        return '<div class="consumer">' + pill +
          ' <span class="url">' + escapeHtml(c.name || "(未命名)") + "</span>" +
          "<br>编号 " + escapeHtml(c.id) +
          " · 最近心跳 " + escapeHtml(c.last_seen_at) + "</div>";
      }).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildLabel(data) {
      const version = data.version ? "v" + data.version : "";
      const git = data.git && data.git !== "unknown" ? data.git : "";
      const built = data.built && data.built !== "unknown" ? data.built : "";
      return [version, git, built ? "构建 " + built : ""].filter(Boolean).join(" · ") || "版本未知";
    }

    function render(data) {
      $("error").style.display = "none";
      $("build").textContent = buildLabel(data);
      $("meta").textContent = "已运行 " + fmtUptime(data.uptime_secs) + " · 刷新于 " +
        new Date().toLocaleTimeString();
      $("cards").innerHTML =
        card("主题数", data.topics) +
        card("在线流", data.consumers) +
        card("已接收", data.accepted) +
        card("待处理", data.pending, data.pending ? "pending" : "") +
        card("投递中", data.processing) +
        card("已投递", data.delivered) +
        card("失败", data.failed, data.failed ? "fail" : "") +
        card("已丢弃", data.dropped || 0) +
        card("重复提交", data.duplicates);

      const topics = data.topics_detail || [];
      if (!topics.length) {
        $("topics").innerHTML = '<div class="empty">暂无主题</div>';
        return;
      }
      $("topics").innerHTML =
        "<table><thead><tr>" +
        "<th>主题</th><th>投递</th><th>持久</th><th>已接收</th><th>待处理</th><th>投递中</th>" +
        "<th>已投递</th><th>失败</th><th>丢弃</th><th>重复</th><th>在线流</th><th>消费者</th>" +
        "</tr></thead><tbody>" +
        topics.map((t) =>
          "<tr><td>" + escapeHtml(t.name) + "</td>" +
          "<td>" + escapeHtml(t.delivery === "broadcast" ? "广播" : "单投") + "</td>" +
          "<td>" + escapeHtml(t.persistence === "ephemeral" ? "即弃" : "持久") + "</td>" +
          "<td>" + t.accepted + "</td>" +
          "<td>" + t.pending + "</td>" +
          "<td>" + t.processing + "</td>" +
          "<td>" + t.delivered + "</td>" +
          '<td class="' + (t.failed ? "fail" : "") + '">' + t.failed + "</td>" +
          "<td>" + (t.dropped || 0) + "</td>" +
          "<td>" + t.duplicates + "</td>" +
          "<td>" + (t.streams || 0) + "</td>" +
          "<td>" + consumersHtml(t.consumers) + "</td></tr>"
        ).join("") +
        "</tbody></table>";
    }

    async function refresh() {
      try {
        const token = new URLSearchParams(location.search).get("token") || "";
        const headers = {};
        if (token) headers.Authorization = "Bearer " + token;
        const response = await fetch("/status", { cache: "no-store", headers });
        if (!response.ok) throw new Error("HTTP " + response.status);
        render(await response.json());
      } catch (error) {
        $("error").style.display = "block";
        $("error").textContent = "无法加载状态接口：" + error.message;
        $("meta").textContent = "离线";
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
