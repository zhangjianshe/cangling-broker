<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CANGLING BROKER · 运行状态</title>
  <script>
    (function () {
      var saved = localStorage.getItem("cl-broker-theme");
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    /* Primer / GitHub color system — same tokens as cangling-update */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117;
      --bg-header: #010409;
      --bg-2: #161b22;
      --bg-3: #212830;
      --bg-input: #0d1117;
      --bg-active: #388bfd1a;
      --line: #3d444d;
      --line-muted: #212830;
      --line-hover: #656c76;
      --text: #f0f6fc;
      --muted: #9198a1;
      --subtle: #656c76;
      --on-emphasis: #ffffff;
      --accent: #4493f8;
      --accent-emphasis: #1f6feb;
      --success: #3fb950;
      --success-emphasis: #238636;
      --success-hover: #2ea043;
      --attention: #d29922;
      --attention-bg: #bb800926;
      --danger: #f85149;
      --danger-emphasis: #da3633;
      --flash-err-bg: #f851491a;
      --flash-err-text: #f85149;
      --flash-err-line: #f8514966;
      --success-bg: #2ea04326;
      --log-bg: #010409;
      --overlay: #21283066;
      --shadow: 0 0 0 1px #3d444d;
      --float-shadow: 0 0 0 1px #3d444d80, 0 16px 32px #01040966;
      --panel: var(--bg-2);
      --live: var(--success);
      --stale: var(--attention);
      --fail: var(--danger);
      --pending: var(--accent);
      --chip: var(--bg-3);
      --live-bg: var(--success-bg);
      --stale-bg: var(--attention-bg);
      --hover: var(--bg-3);
      --selected: var(--bg-active);
      --btn-hover: var(--bg-2);
      --inset: var(--log-bg);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --bg-header: #f6f8fa;
      --bg-2: #ffffff;
      --bg-3: #f6f8fa;
      --bg-input: #ffffff;
      --bg-active: #ddf4ff;
      --line: #d1d9e0;
      --line-muted: #d8dee4;
      --line-hover: #8c959f;
      --text: #1f2328;
      --muted: #59636e;
      --subtle: #818b98;
      --on-emphasis: #ffffff;
      --accent: #0969da;
      --accent-emphasis: #0969da;
      --success: #1a7f37;
      --success-emphasis: #1f883d;
      --success-hover: #1c8139;
      --attention: #9a6700;
      --attention-bg: #fff8c5;
      --danger: #d1242f;
      --danger-emphasis: #cf222e;
      --flash-err-bg: #ffebe9;
      --flash-err-text: #d1242f;
      --flash-err-line: #ff818266;
      --success-bg: #dafbe1;
      --log-bg: #f6f8fa;
      --overlay: #c8d1da66;
      --shadow: 0 1px 0 rgba(31, 35, 40, 0.04);
      --float-shadow: 0 0 0 1px #d1d9e040, 0 6px 12px -3px #25292e0a, 0 6px 18px 0 #25292e1f;
      --panel: var(--bg-2);
      --live: var(--success);
      --stale: var(--attention);
      --fail: var(--danger);
      --pending: var(--accent);
      --chip: var(--bg-3);
      --live-bg: var(--success-bg);
      --stale-bg: var(--attention-bg);
      --hover: var(--bg-3);
      --selected: var(--bg-active);
      --btn-hover: var(--bg-2);
      --inset: var(--log-bg);
    }
    * { box-sizing: border-box; border-radius: 4px; }
    html { font-size: 16px; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Noto Sans CJK SC", Helvetica, Arial, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      min-height: 64px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-header);
      border-radius: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 28px; height: 28px; flex: 0 0 auto;
      background: var(--success-emphasis);
    }
    h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: 0.02em; }
    .app-ver {
      display: inline-block; margin-left: 8px; padding: 1px 8px;
      border: 1px solid var(--line); background: var(--bg-3); color: var(--muted);
      font-size: 14px; font-weight: 500; vertical-align: middle;
    }
    .app-ver:empty { display: none; }
    #build { display: block; color: var(--muted); margin-top: 1px; word-break: break-all; }
    .header-right {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0;
      margin-left: auto;
    }
    header .btn { height: 34px; display: inline-flex; align-items: center; }
    .topnav {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
    }
    .topnav a {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
    }
    .topnav a:hover { color: var(--text); background: var(--bg-3); }
    .topnav a.active {
      color: var(--text);
      background: var(--bg-active);
      border-color: var(--line);
      font-weight: 600;
    }
    .meta, #meta {
      color: var(--muted); display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap; justify-content: flex-end;
    }
    #meta > span {
      display: inline-flex; align-items: center; height: 34px; padding: 0 10px;
      border: 1px solid var(--line); background: var(--bg-3); line-height: 1;
    }
    #meta b { color: var(--text); font-weight: 600; }
    .btn,
    .pager button,
    .msg-toolbar button,
    .modal-close {
      border: 1px solid var(--line); background: var(--bg-3); color: var(--text);
      padding: 7px 12px; white-space: nowrap;
    }
    .btn:hover,
    .pager button:hover,
    .msg-toolbar button:hover,
    .modal-close:hover { background: var(--bg-2); border-color: var(--line-hover); }
    .btn:disabled,
    .pager button:disabled,
    .msg-toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .page { padding: 22px 26px 40px; }
    #error {
      display: none;
      margin: 0 0 14px;
      padding: 10px 12px;
      background: var(--flash-err-bg);
      color: var(--flash-err-text);
      border: 1px solid var(--flash-err-line);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .card .label { color: var(--muted); font-size: 13px; }
    .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    section { padding: 0; }
    h2 { font-size: 16px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
    .tabs-wrap { padding: 0; }
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
      border-radius: 0;
    }
    .tabs button {
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: var(--muted);
      padding: 8px 14px;
      margin-bottom: -1px;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active {
      color: var(--text);
      border-bottom-color: var(--accent-emphasis);
      font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; background: var(--bg-2); }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 700; }
    th.seq, td.seq {
      width: 1%;
      white-space: nowrap;
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    tr:last-child td { border-bottom: 0; }
    .empty { color: var(--muted); padding: 28px 8px; text-align: center; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); padding: 3px 9px;
      color: var(--muted); background: var(--bg-3); font-size: 13px;
    }
    .live { background: var(--live-bg); color: var(--live); border-color: transparent; }
    .stale { background: var(--stale-bg); color: var(--stale); border-color: transparent; }
    .url { color: var(--text); word-break: break-all; }
    .fail { color: var(--fail); }
    .pending { color: var(--pending); }
    .topic-list td.zero { color: var(--muted); opacity: 0.4; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
    .attr {
      display: inline-block;
      margin: 1px 4px 1px 0;
      padding: 0 6px;
      background: var(--bg-3);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .client-list, .topic-list {
      background: var(--bg-2);
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .client-list table, .topic-list table { border-radius: 0; }
    .client-list tr, .topic-list tr { cursor: pointer; }
    .client-list tr:hover td, .topic-list tr:hover td { background: var(--hover); }
    .client-list tr.selected td, .topic-list tr.selected td { background: var(--selected); }
    .hint { color: var(--muted); }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: var(--overlay);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 8vh 16px 24px;
      border-radius: 0;
    }
    .modal[hidden] { display: none; }
    .modal-panel {
      width: min(920px, 100%);
      max-height: 80vh;
      background: var(--bg-2);
      border: 1px solid var(--line);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--float-shadow);
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-header);
      border-radius: 0;
    }
    .modal-head h2 {
      margin: 0;
      color: var(--text);
      font-size: 18px;
      word-break: break-all;
    }
    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .modal-close { flex-shrink: 0; }
    .row-btn {
      border: 1px solid var(--flash-err-line);
      background: var(--flash-err-bg);
      color: var(--flash-err-text);
      padding: 3px 9px;
      white-space: nowrap;
    }
    .row-btn:hover {
      background: var(--danger-emphasis);
      color: var(--on-emphasis);
      border-color: var(--danger-emphasis);
    }
    .modal-body { overflow: auto; border-radius: 0; }
    .msg-view {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
    }
    .msg-view h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .msg-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin-bottom: 8px;
    }
    .msg-toolbar .btns { display: flex; gap: 8px; }
    .msg-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .msg-payload {
      margin: 0;
      padding: 12px;
      background: var(--log-bg);
      border: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 260px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .client-detail {
      margin-top: 10px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .client-detail .head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 14px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-header);
      border-radius: 0;
    }
    .client-detail .head .meta { color: var(--muted); font-size: 13px; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .section-head h2 { margin: 0; }
    .cache-form {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px 16px;
      margin-bottom: 12px;
    }
    .cache-form label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      min-width: 0;
    }
    .cache-form label span { white-space: nowrap; }
    .cache-form input {
      background: var(--bg-input);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 11px;
      outline: none;
      min-width: 0;
    }
    .cache-form input:focus {
      border-color: var(--accent-emphasis);
      box-shadow: 0 0 0 3px var(--bg-active);
    }
    #cache-key, #lock-key { width: 280px; }
    #cache-value { width: 340px; }
    #cache-ttl, #lock-ttl, #cache-delta { width: 120px; }
    #lock-owner { width: 280px; }
    .cache-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .cache-result {
      margin-bottom: 16px;
      color: var(--muted);
    }
    .cache-result pre { margin: 8px 0 0; }
    .list {
      background: var(--bg-2);
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .list table { border-radius: 0; }
    .list th, .list td { word-break: break-word; }
    .pager {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 0;
      color: var(--muted);
    }
    .pager.top { margin-top: 0; }
    .pager.bottom { margin-bottom: 0; }
    .pager .btns { display: flex; align-items: center; gap: 8px; }
    .pager .page-size {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      white-space: nowrap;
    }
    .pager .page-size input {
      width: 4.5em;
      min-width: 4.5em;
      background: var(--bg-input);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 7px 8px;
      outline: none;
    }
    .pager .page-size input:focus {
      border-color: var(--accent-emphasis);
      box-shadow: 0 0 0 3px var(--bg-active);
    }
    .table-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      margin-bottom: 10px;
    }
    .table-tools label {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 0 0 auto;
      color: var(--muted);
    }
    .table-tools label span {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .table-tools select,
    .table-tools input {
      background: var(--bg-input);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 11px;
      outline: none;
    }
    .table-tools select { flex: 0 0 auto; }
    #topic-name-filter {
      width: 250px;
      min-width: 250px;
      flex: 0 0 250px;
    }
    .table-tools select:focus,
    .table-tools input:focus {
      border-color: var(--accent-emphasis);
      box-shadow: 0 0 0 3px var(--bg-active);
    }
    @media (max-width: 720px) {
      header { height: auto; padding: 12px 16px; }
      .page { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>CANGLING BROKER <span class="app-ver" id="version"></span></h1>
        <small id="build">正在加载版本…</small>
      </div>
    </div>
    <nav class="topnav" aria-label="主菜单">
      <a href="#messages" data-view="messages" class="active">消息</a>
      <a href="#cache" data-view="cache">缓存</a>
      <a href="#lock" data-view="lock">分布式锁</a>
    </nav>
    <div class="header-right">
      <div class="meta" id="meta"><span>正在加载…</span></div>
      <button type="button" class="btn" id="theme-toggle" aria-label="切换深色或浅色主题">浅色</button>
    </div>
  </header>
  <main class="page">
  <div id="error"></div>
  <section id="view-messages" data-view-panel="messages">
  <div class="cards" id="cards"></div>
  <div class="tabs-wrap">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-clients" data-tab="clients" aria-controls="panel-clients" aria-selected="true" class="active">已连接客户端</button>
      <button type="button" role="tab" id="tab-topics" data-tab="topics" aria-controls="panel-topics" aria-selected="false">主题</button>
    </div>
    <section id="panel-clients" role="tabpanel" aria-labelledby="tab-clients">
      <div class="table-tools">
        <label><span>连接类型</span>
          <select id="client-type-filter" aria-label="按连接类型筛选">
            <option value="">全部</option>
            <option value="grpc">gRPC</option>
            <option value="mqtt">MQTT</option>
            <option value="mqtt-ws">MQTT-WS</option>
          </select>
        </label>
      </div>
      <div id="clients"></div>
    </section>
    <section id="panel-topics" role="tabpanel" aria-labelledby="tab-topics" hidden>
      <div class="table-tools">
        <label><span>主题名</span>
          <input id="topic-name-filter" type="search" placeholder="模糊搜索，空格分隔多个词" aria-label="模糊搜索主题名">
        </label>
      </div>
      <div id="topics"></div>
    </section>
  </div>
  </section>
  <section id="view-cache" data-view-panel="cache" hidden>
    <h2>缓存</h2>
    <div class="cache-form">
      <label><span>键</span><input id="cache-key" type="text" placeholder="例如 session:u1" autocomplete="off"></label>
      <label><span>值</span><input id="cache-value" type="text" placeholder="写入 / 查询的值" autocomplete="off"></label>
      <label><span>TTL（秒）</span><input id="cache-ttl" type="number" min="0" value="0"></label>
      <label><span>增量</span><input id="cache-delta" type="number" value="1"></label>
    </div>
    <div class="cache-actions">
      <button type="button" class="btn" data-cache-op="get">查询</button>
      <button type="button" class="btn" data-cache-op="set">写入</button>
      <button type="button" class="btn" data-cache-op="delete">删除</button>
      <button type="button" class="btn" data-cache-op="incr">自增</button>
    </div>
    <div id="cache-result" class="cache-result"></div>
    <div class="section-head">
      <h2>全部键（<span id="cache-count">0</span>）</h2>
      <button type="button" class="btn" id="cache-refresh">刷新</button>
    </div>
    <div id="cache-list"></div>
  </section>
  <section id="view-lock" data-view-panel="lock" hidden>
    <h2>分布式锁</h2>
    <div class="cache-form">
      <label><span>锁键</span><input id="lock-key" type="text" placeholder="例如 import:dataset" autocomplete="off"></label>
      <label><span>持有者</span><input id="lock-owner" type="text" placeholder="例如 owner-uuid" autocomplete="off"></label>
      <label><span>TTL（秒）</span><input id="lock-ttl" type="number" min="1" value="30"></label>
    </div>
    <div class="cache-actions">
      <button type="button" class="btn" data-lock-op="get">查询状态</button>
      <button type="button" class="btn" data-lock-op="acquire">获取锁</button>
      <button type="button" class="btn" data-lock-op="renew">续期</button>
      <button type="button" class="btn" data-lock-op="release">释放</button>
    </div>
    <div id="lock-result" class="cache-result"></div>
    <div class="section-head">
      <h2>全部锁（<span id="lock-count">0</span>）</h2>
      <button type="button" class="btn" id="lock-refresh">刷新</button>
    </div>
    <div id="lock-list"></div>
  </section>
  </main>
  <div id="topic-modal" class="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="topic-modal-title">
      <div class="modal-head">
        <div>
          <h2 id="topic-modal-title">主题</h2>
          <div id="topic-modal-meta" class="modal-meta"></div>
        </div>
        <button type="button" class="btn modal-close" data-close-topic-modal aria-label="关闭">关闭</button>
      </div>
      <div id="topic-modal-body" class="modal-body"></div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const THEME_KEY = "cl-broker-theme";
    const TAB_KEY = "cl-broker-tab";
    const VIEW_KEY = "cl-broker-view";
    const VIEWS = ["messages", "cache", "lock"];

    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }

    function syncThemeButton() {
      const light = currentTheme() === "light";
      const button = $("theme-toggle");
      if (!button) return;
      button.textContent = light ? "深色" : "浅色";
      button.setAttribute("aria-label", light ? "切换到深色主题" : "切换到浅色主题");
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
      syncThemeButton();
    }

    $("theme-toggle").addEventListener("click", () => {
      setTheme(currentTheme() === "light" ? "dark" : "light");
    });
    syncThemeButton();

    function currentView() {
      const first = (location.hash.replace(/^#/, "").split("/")[0] || "").toLowerCase();
      return VIEWS.indexOf(first) >= 0 ? first : "messages";
    }

    function currentTab() {
      const parts = location.hash.replace(/^#/, "").split("/");
      const tab = parts[1];
      if (tab === "topics" || tab === "clients") return tab;
      try {
        const saved = localStorage.getItem(TAB_KEY);
        if (saved === "topics" || saved === "clients") return saved;
      } catch (_) {}
      return "clients";
    }

    function applyTab(tab) {
      document.querySelectorAll("[data-tab]").forEach((btn) => {
        const on = btn.getAttribute("data-tab") === tab;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-selected", on ? "true" : "false");
      });
      $("panel-clients").hidden = tab !== "clients";
      $("panel-topics").hidden = tab !== "topics";
    }

    function writeHash(view, tab) {
      const hash = view === "messages" ? "#" + view + "/" + tab : "#" + view;
      if (location.hash !== hash) history.replaceState(null, "", hash);
    }

    function setTab(name) {
      const tab = name === "topics" ? "topics" : "clients";
      try { localStorage.setItem(TAB_KEY, tab); } catch (_) {}
      applyTab(tab);
      writeHash(currentView(), tab);
    }

    function setView(name) {
      const view = VIEWS.indexOf(name) >= 0 ? name : "messages";
      try { localStorage.setItem(VIEW_KEY, view); } catch (_) {}
      document.querySelectorAll(".topnav [data-view]").forEach((link) => {
        link.classList.toggle("active", link.getAttribute("data-view") === view);
      });
      document.querySelectorAll("[data-view-panel]").forEach((panel) => {
        panel.hidden = panel.getAttribute("data-view-panel") !== view;
      });
      if (view === "messages") {
        const tab = currentTab();
        applyTab(tab);
        writeHash(view, tab);
      } else {
        writeHash(view, null);
        if (view === "cache") loadCache();
        if (view === "lock") loadLocks();
      }
    }

    document.querySelector(".topnav").addEventListener("click", (event) => {
      const link = event.target.closest("[data-view]");
      if (link) {
        event.preventDefault();
        setView(link.getAttribute("data-view"));
      }
    });
    document.querySelector(".tabs").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-tab]");
      if (btn) setTab(btn.getAttribute("data-tab"));
    });
    window.addEventListener("hashchange", () => {
      setView(currentView());
    });
    (function initRouting() {
      const view = currentView();
      try {
        if (!location.hash || location.hash === "#") {
          const savedView = localStorage.getItem(VIEW_KEY);
          setView(VIEWS.indexOf(savedView) >= 0 ? savedView : "messages");
          return;
        }
      } catch (_) {}
      setView(view);
    })();

    let topicPageSize = 10;
    let clientPageSize = 10;
    let topicPage = 0;
    let clientPage = 0;
    let lastTopics = [];
    let lastClients = [];
    let selectedClientKey = "";
    let selectedTopicName = "";
    let clientTypeFilter = "";
    let topicNameQuery = "";
    let messageOffset = 0;
    let messageTopic = "";

    function fmtBytes(n) {
      const bytes = Number(n) || 0;
      if (bytes < 1024) return bytes + " B";
      const units = ["KB", "MB", "GB", "TB"];
      let value = bytes / 1024;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      const digits = value >= 10 ? 0 : 1;
      return value.toFixed(digits) + " " + units[unit];
    }

    function fmtUptime(secs) {
      const s = Math.max(0, Math.floor(Number(secs) || 0));
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (d) return d + " 天 " + h + " 小时";
      if (h) return h + " 小时 " + m + " 分";
      if (m) return m + " 分 " + r + " 秒";
      return r + " 秒";
    }

    function fmtSince(value) {
      if (value == null || value === "") return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return fmtUptime((Date.now() - date.getTime()) / 1000);
    }

    function card(label, value, cls) {
      return '<div class="card"><div class="label">' + label + '</div>' +
        '<div class="value' + (cls ? " " + cls : "") + '">' + value + "</div></div>";
    }

    function consumerSummary(list) {
      const total = (list || []).length;
      if (!total) return '<span class="hint">暂无</span>';
      const live = list.filter((c) => c.live).length;
      const stale = total - live;
      return '<span class="pill live">' + live + " 在线</span>" +
        (stale ? ' <span class="pill stale">' + stale + " 离线</span>" : "") +
        ' <span class="hint">点击查看</span>';
    }

    function consumersTable(list) {
      if (!list || !list.length) return '<div class="empty">暂无消费者</div>';
      const rows = list.map((c, i) =>
        '<tr><td class="seq">' + (i + 1) + "</td>" +
        "<td>" + (c.live
          ? '<span class="pill live">在线</span>'
          : '<span class="pill stale">离线</span>') + "</td>" +
        '<td class="url">' + escapeHtml(c.name || "(未命名)") + "</td>" +
        '<td class="mono">' + escapeHtml(c.id) + "</td>" +
        "<td>" + escapeHtml(fmtTs(c.last_seen_at)) + "</td>" +
        "<td>" + attrsHtml(c.attributes) + "</td></tr>"
      ).join("");
      return "<table><thead><tr>" +
        "<th class=\"seq\">序号</th><th>状态</th><th>名称</th><th>编号</th><th>最近心跳</th><th>属性</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table>";
    }

    function closeTopicModal() {
      selectedTopicName = "";
      messageTopic = "";
      messageOffset = 0;
      $("topic-modal").hidden = true;
    }

    function messageStatusLabel(status) {
      if (status === "pending") return "待处理";
      if (status === "processing") return "投递中";
      if (status === "delivered") return "已投递";
      if (status === "failed") return "失败";
      if (status === "dropped") return "已丢弃";
      return status || "—";
    }

    function messageViewerHtml(html) {
      return '<div id="topic-message" class="msg-view">' + html + "</div>";
    }

    function renderTopicMessage(data) {
      const box = $("topic-message");
      if (!box) return;
      const total = Number(data.total) || 0;
      const offset = Number(data.offset) || 0;
      const index = total ? offset + 1 : 0;
      const newerDisabled = offset <= 0 ? " disabled" : "";
      const olderDisabled = !total || offset >= total - 1 ? " disabled" : "";
      const toolbar =
        '<div class="msg-toolbar"><h3>消息</h3><span>' +
        (total ? ("第 " + index + " / " + total + " 条") : "0 条") +
        '</span><span class="btns">' +
        '<button type="button" data-msg-nav="newer"' + newerDisabled + ">较新</button>" +
        '<button type="button" data-msg-nav="older"' + olderDisabled + ">较旧</button>" +
        "</span></div>";
      if (!data.message) {
        box.innerHTML = toolbar + '<div class="empty">暂无已保存消息</div>';
        return;
      }
      const msg = data.message;
      const encoding = msg.payload_encoding === "base64" ? "base64" : "utf-8";
      box.innerHTML = toolbar +
        '<div class="msg-meta">' +
        '<span class="pill">' + escapeHtml(messageStatusLabel(msg.status)) + "</span>" +
        '<span class="mono">' + escapeHtml(msg.id) + "</span>" +
        (msg.topic && msg.topic !== selectedTopicName
          ? '<span class="mono">' + escapeHtml(msg.topic) + "</span>"
          : "") +
        "<span>入队 " + escapeHtml(fmtTs(msg.created_at)) + "</span>" +
        (msg.delivered_at ? "<span>投递 " + escapeHtml(fmtTs(msg.delivered_at)) + "</span>" : "") +
        "<span>尝试 " + (msg.attempts || 0) + " 次</span>" +
        (msg.truncated ? "<span>内容已截断</span>" : "") +
        (encoding === "base64" ? "<span>二进制</span>" : "") +
        "</div>" +
        (attrsHtml(msg.attributes) !== "—" ? "<div>" + attrsHtml(msg.attributes) + "</div>" : "") +
        (msg.last_error ? '<div class="fail">' + escapeHtml(msg.last_error) + "</div>" : "") +
        '<pre class="msg-payload">' + escapeHtml(msg.payload || "") + "</pre>";
    }

    async function loadTopicMessage(topic, offset) {
      const box = $("topic-message");
      if (box) box.innerHTML = '<div class="empty">正在加载消息…</div>';
      try {
        const url = new URL(apiUrl("messages"));
        url.searchParams.set("topic", topic);
        url.searchParams.set("offset", String(offset));
        const token = new URLSearchParams(location.search).get("token") || "";
        if (token) url.searchParams.set("token", token);
        const headers = {};
        if (token) headers.Authorization = "Bearer " + token;
        const response = await fetch(url.toString(), { cache: "no-store", headers });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (selectedTopicName !== topic) return;
        messageOffset = Number(data.offset) || 0;
        renderTopicMessage(data);
      } catch (error) {
        const current = $("topic-message");
        if (current) {
          current.innerHTML = '<div class="empty">无法加载消息：' + escapeHtml(error.message) + "</div>";
        }
      }
    }

    function fillTopicModal() {
      const modal = $("topic-modal");
      if (!selectedTopicName) {
        modal.hidden = true;
        return;
      }
      const topic = lastTopics.find((item) => item.name === selectedTopicName);
      if (!topic) {
        closeTopicModal();
        return;
      }
      $("topic-modal-title").textContent = topic.name;
      const consumers = topic.consumers || [];
      const live = consumers.filter((c) => c.live).length;
      $("topic-modal-meta").innerHTML =
        '<span class="pill">' + escapeHtml(topic.delivery === "broadcast" ? "广播" : "单投") + "</span>" +
        '<span class="pill">' + escapeHtml(topic.persistence === "ephemeral" ? "即弃" : "持久") + "</span>" +
        '<span class="pill live">' + live + " 在线</span>" +
        '<span>' + consumers.length + " 个消费者</span>" +
        '<span>' + (topic.streams || 0) + " 条在线流</span>";
      const body = $("topic-modal-body");
      const top = body.scrollTop;
      const persistent = topic.persistence !== "ephemeral";
      const consumersBlock = consumersTable(consumers);
      if (!persistent) {
        messageTopic = "";
        messageOffset = 0;
        body.innerHTML = messageViewerHtml('<div class="empty">即弃主题不保存消息</div>') + consumersBlock;
      } else {
        const existing = $("topic-message");
        const sameTopic = messageTopic === topic.name && existing;
        body.innerHTML = (sameTopic ? existing.outerHTML : messageViewerHtml('<div class="empty">正在加载消息…</div>')) +
          consumersBlock;
        if (!sameTopic) {
          messageTopic = topic.name;
          messageOffset = 0;
          loadTopicMessage(topic.name, 0);
        }
      }
      body.scrollTop = top;
      modal.hidden = false;
    }

    function attrsHtml(attrs) {
      if (!attrs || typeof attrs !== "object") return "—";
      const keys = Object.keys(attrs);
      if (!keys.length) return "—";
      return keys.map((key) =>
        '<span class="attr">' + escapeHtml(key) + "=" + escapeHtml(attrs[key]) + "</span>"
      ).join("");
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function fmtTs(value) {
      if (value == null || value === "") return "—";
      if (typeof value === "string" && /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(value)) {
        return value;
      }
      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.getFullYear() + "-" +
        pad2(date.getMonth() + 1) + "-" +
        pad2(date.getDate()) + " " +
        pad2(date.getHours()) + ":" +
        pad2(date.getMinutes()) + ":" +
        pad2(date.getSeconds());
    }

    function clientKey(client) {
      return (client.protocol || "grpc") + "|" + (client.host || "") + "|" +
        (client.client_id || "") + "|" + (client.peer || "");
    }

    function clientType(protocol) {
      if (protocol === "mqtt-ws") return "MQTT-WS";
      if (protocol === "mqtt") return "MQTT";
      return "gRPC";
    }

    function fuzzyMatch(text, query) {
      const raw = String(query || "").trim().toLowerCase();
      if (!raw) return true;
      const hay = String(text || "").toLowerCase();
      if (hay.includes(raw)) return true;
      return raw.split(/\s+/).every((token) => token && hay.includes(token));
    }

    function filteredClients(clients) {
      if (!clientTypeFilter) return clients;
      return clients.filter((item) => (item.protocol || "grpc") === clientTypeFilter);
    }

    function filteredTopics(topics) {
      if (!topicNameQuery.trim()) return topics;
      return topics.filter((item) => fuzzyMatch(item.name, topicNameQuery));
    }

    function renderClients(clients) {
      lastClients = clients;
      $("tab-clients").textContent = "已连接客户端" + (clients.length ? " · " + clients.length : "");
      const shown = filteredClients(clients);
      if (!clients.length) {
        selectedClientKey = "";
        $("clients").innerHTML = '<div class="empty">暂无已连接客户端</div>';
        return;
      }
      if (!shown.length) {
        $("clients").innerHTML = '<div class="empty">无匹配该连接类型的客户端</div>';
        return;
      }
      if (selectedClientKey && !shown.some((item) => clientKey(item) === selectedClientKey)) {
        selectedClientKey = "";
      }
      const pages = Math.max(1, Math.ceil(shown.length / clientPageSize));
      if (clientPage >= pages) clientPage = pages - 1;
      if (clientPage < 0) clientPage = 0;
      const start = clientPage * clientPageSize;
      const pageItems = shown.slice(start, start + clientPageSize);
      const from = start + 1;
      const to = Math.min(shown.length, start + clientPageSize);
      const rows = pageItems.map((client, i) => {
        const key = clientKey(client);
        const selected = key === selectedClientKey ? " selected" : "";
        return '<tr class="' + selected.trim() + '" data-client-key="' + escapeHtml(key) + '">' +
          '<td class="seq">' + (start + i + 1) + "</td>" +
          '<td class="mono">' + escapeHtml(client.host || "—") + "</td>" +
          '<td class="mono">' + escapeHtml(client.peer || "未知来源") + "</td>" +
          "<td><span class=\"pill\">" + escapeHtml(clientType(client.protocol)) + "</span></td>" +
          '<td class="mono">' + escapeHtml(client.client_id || "—") + "</td>" +
          '<td class="mono">' + escapeHtml(client.version || "—") + "</td>" +
          "<td>" + (client.streams || (client.subscriptions || []).length) + "</td>" +
          "<td>" + escapeHtml(fmtSince(client.connected_at)) + "</td></tr>";
      }).join("");
      const table =
        '<div class="client-list"><table><thead><tr>' +
        "<th class=\"seq\">序号</th><th>主机</th><th>地址</th><th>类型</th><th>客户端</th><th>版本</th><th>订阅数</th><th>连接时长</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table></div>";
      $("clients").innerHTML =
        withPagers(table, from, to, shown.length, clientPage + 1, pages, "client-page") +
        clientDetailHtml();
    }

    function clientDetailHtml() {
      if (!selectedClientKey) {
        return '<div class="empty">点击上表中的客户端查看订阅主题</div>';
      }
      const client = lastClients.find((item) => clientKey(item) === selectedClientKey);
      if (!client) return "";
      const subs = client.subscriptions || [];
      const rows = subs.map((sub, i) =>
        '<tr><td class="seq">' + (i + 1) + "</td>" +
        "<td class=\"mono\">" + escapeHtml(sub.topic || "") + "</td>" +
        "<td>" + escapeHtml(sub.name || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(sub.id) + "</td>" +
        "<td>" + escapeHtml(fmtTs(sub.connected_at)) + "</td></tr>"
      ).join("");
      const body = rows
        ? "<table><thead><tr><th class=\"seq\">序号</th><th>订阅主题</th><th>名称</th><th>编号</th><th>订阅时间</th></tr></thead><tbody>" +
          rows + "</tbody></table>"
        : '<div class="empty">已连接，暂无订阅</div>';
      return '<div class="client-detail"><div class="head">' +
        '<span class="pill live">在线</span>' +
        '<span class="pill">' + escapeHtml(clientType(client.protocol)) + "</span>" +
        (client.host ? '<span class="mono url">' + escapeHtml(client.host) + "</span>" : "") +
        '<span class="mono url">' + escapeHtml(client.peer || "未知来源") + "</span>" +
        (client.client_id ? '<span class="mono url">' + escapeHtml(client.client_id) + "</span>" : "") +
        (client.version ? '<span class="pill">' + escapeHtml(client.version) + "</span>" : "") +
        '<span class="meta">' + (subs.length) + " 个订阅</span></div>" + body + "</div>";
    }

    function pagerBar(from, to, total, page, pages, kind, pos) {
      const sizeKind = kind === "topic-page" ? "topic" : "client";
      const size = sizeKind === "topic" ? topicPageSize : clientPageSize;
      return '<div class="pager ' + (pos || "") + '">' +
        '<span class="btns">' +
        '<button type="button" data-' + kind + '="prev"' + (page <= 1 ? " disabled" : "") + ">上一页</button>" +
        '<button type="button" data-' + kind + '="next"' + (page >= pages ? " disabled" : "") + ">下一页</button>" +
        '<label class="page-size"><span>每页</span>' +
        '<input type="number" min="1" max="200" value="' + size +
        '" data-page-size="' + sizeKind + '" aria-label="每页条数"></label>' +
        "</span>" +
        "<span>第 " + from + "–" + to + " 条，共 " + total +
        " 条 · 第 " + page + "/" + pages + " 页</span></div>";
    }

    function withPagers(tableHtml, from, to, total, page, pages, kind) {
      return pagerBar(from, to, total, page, pages, kind, "top") +
        tableHtml +
        pagerBar(from, to, total, page, pages, kind, "bottom");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildLabel(data) {
      const git = data.git && data.git !== "unknown" ? data.git : "";
      const built = data.built && data.built !== "unknown" ? fmtTs(data.built) : "";
      return [git, built ? "构建 " + built : ""].filter(Boolean).join(" · ") || "版本未知";
    }

    function render(data) {
      $("error").style.display = "none";
      $("version").textContent = data.version ? "v" + data.version : "";
      $("build").textContent = buildLabel(data);
      $("meta").innerHTML =
        "<span>已运行 <b>" + escapeHtml(fmtUptime(data.uptime_secs)) + "</b></span>" +
        "<span>刷新于 <b>" + escapeHtml(fmtTs(new Date())) + "</b></span>";
      $("cards").innerHTML =
        card("主题数", data.topics) +
        card("客户端", (data.clients || []).length) +
        card("在线流", data.consumers) +
        card("已接收", data.accepted) +
        card("待处理", data.pending, data.pending ? "pending" : "") +
        card("投递中", data.processing) +
        card("已投递", data.delivered) +
        card("失败", data.failed, data.failed ? "fail" : "") +
        card("已丢弃", data.dropped || 0) +
        card("重复提交", data.duplicates) +
        card("SQLite", fmtBytes(data.db_bytes));

      renderClients(data.clients || []);
      renderTopics(data.topics_detail || []);
    }

    function numCell(value, extra) {
      const n = Number(value) || 0;
      const cls = [n === 0 ? "zero" : "", extra || ""].filter(Boolean).join(" ");
      return "<td" + (cls ? ' class="' + cls + '"' : "") + ">" + n + "</td>";
    }

    function topicsTable(pageItems, start) {
      const rows = pageItems.map((t, i) => {
        const selected = t.name === selectedTopicName ? " selected" : "";
        return '<tr class="' + selected.trim() + '" data-topic-name="' + escapeHtml(t.name) + '">' +
          '<td class="seq">' + (start + i + 1) + "</td>" +
          "<td>" + escapeHtml(t.name) + "</td>" +
          "<td>" + escapeHtml(t.delivery === "broadcast" ? "广播" : "单投") + "</td>" +
          "<td>" + escapeHtml(t.persistence === "ephemeral" ? "即弃" : "持久") + "</td>" +
          numCell(t.accepted) +
          numCell(t.pending) +
          numCell(t.processing) +
          numCell(t.delivered) +
          numCell(t.failed, t.failed ? "fail" : "") +
          numCell(t.dropped) +
          numCell(t.duplicates) +
          numCell(t.streams) +
          "<td>" + consumerSummary(t.consumers) + "</td>" +
          '<td><button type="button" class="row-btn" data-clear-topic="' +
          escapeHtml(t.name) + '">清空</button></td></tr>';
      }).join("");
      return '<div class="topic-list"><table><thead><tr>' +
        "<th class=\"seq\">序号</th><th>主题</th><th>投递</th><th>持久</th><th>已接收</th><th>待处理</th><th>投递中</th>" +
        "<th>已投递</th><th>失败</th><th>丢弃</th><th>重复</th><th>在线流</th><th>消费者</th><th>操作</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    }

    function renderTopics(topics) {
      lastTopics = topics;
      $("tab-topics").textContent = "主题" + (topics.length ? " · " + topics.length : "");
      const shown = filteredTopics(topics);
      if (!topics.length) {
        $("topics").innerHTML = '<div class="empty">暂无主题</div>';
        fillTopicModal();
        return;
      }
      if (!shown.length) {
        $("topics").innerHTML = '<div class="empty">无匹配主题</div>';
        fillTopicModal();
        return;
      }
      const pages = Math.max(1, Math.ceil(shown.length / topicPageSize));
      if (topicPage >= pages) topicPage = pages - 1;
      if (topicPage < 0) topicPage = 0;
      const start = topicPage * topicPageSize;
      const from = start + 1;
      const to = Math.min(shown.length, start + topicPageSize);
      $("topics").innerHTML = withPagers(
        topicsTable(shown.slice(start, start + topicPageSize), start),
        from, to, shown.length, topicPage + 1, pages, "topic-page"
      );
      fillTopicModal();
    }

    async function clearTopicMessages(topic) {
      const token = new URLSearchParams(location.search).get("token") || "";
      const url = new URL(apiUrl("messages"));
      url.searchParams.set("topic", topic);
      if (token) url.searchParams.set("token", token);
      const headers = {};
      if (token) headers.Authorization = "Bearer " + token;
      const response = await fetch(url.toString(), { method: "DELETE", cache: "no-store", headers });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    }

    document.addEventListener("click", (event) => {
      const clearBtn = event.target.closest("[data-clear-topic]");
      if (clearBtn) {
        event.stopPropagation();
        const topic = clearBtn.getAttribute("data-clear-topic") || "";
        if (!topic) return;
        if (!confirm("清空主题 “" + topic + "” 的全部消息？此操作不可恢复。")) return;
        clearTopicMessages(topic).then((result) => {
          if (selectedTopicName === topic) {
            messageTopic = "";
            messageOffset = 0;
          }
          refresh();
          if (result && result.deleted != null) {
            $("meta").textContent = "已清空 " + topic + " · " + result.deleted + " 条";
          }
        }).catch((error) => {
          $("error").style.display = "block";
          $("error").textContent = "清空失败：" + error.message;
        });
        return;
      }
      const nav = event.target.closest("[data-msg-nav]");
      if (nav && !nav.disabled && selectedTopicName) {
        if (nav.getAttribute("data-msg-nav") === "older") messageOffset += 1;
        else messageOffset = Math.max(0, messageOffset - 1);
        loadTopicMessage(selectedTopicName, messageOffset);
        return;
      }
      if (event.target.closest("[data-close-topic-modal]")) {
        closeTopicModal();
        renderTopics(lastTopics);
        return;
      }
      const modal = $("topic-modal");
      if (modal && !modal.hidden && event.target === modal) {
        closeTopicModal();
        renderTopics(lastTopics);
        return;
      }
      const topicRow = event.target.closest("[data-topic-name]");
      if (topicRow) {
        const name = topicRow.getAttribute("data-topic-name") || "";
        selectedTopicName = selectedTopicName === name ? "" : name;
        renderTopics(lastTopics);
        return;
      }
      const row = event.target.closest("[data-client-key]");
      if (row) {
        const key = row.getAttribute("data-client-key") || "";
        selectedClientKey = selectedClientKey === key ? "" : key;
        renderClients(lastClients);
        return;
      }
      const clientBtn = event.target.closest("[data-client-page]");
      if (clientBtn && !clientBtn.disabled) {
        if (clientBtn.getAttribute("data-client-page") === "prev") clientPage -= 1;
        else clientPage += 1;
        renderClients(lastClients);
        return;
      }
      const topicBtn = event.target.closest("[data-topic-page]");
      if (topicBtn && !topicBtn.disabled) {
        if (topicBtn.getAttribute("data-topic-page") === "prev") topicPage -= 1;
        else topicPage += 1;
        renderTopics(lastTopics);
      }
    });

    document.addEventListener("keydown", (event) => {
      if ($("topic-modal").hidden) return;
      const typing = event.target && /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName);
      if (event.key === "Escape") {
        closeTopicModal();
        renderTopics(lastTopics);
        return;
      }
      if (typing || !selectedTopicName) return;
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        messageOffset += 1;
        loadTopicMessage(selectedTopicName, messageOffset);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        messageOffset = Math.max(0, messageOffset - 1);
        loadTopicMessage(selectedTopicName, messageOffset);
      }
    });

    $("client-type-filter").addEventListener("change", (event) => {
      clientTypeFilter = event.target.value || "";
      clientPage = 0;
      renderClients(lastClients);
    });
    $("topic-name-filter").addEventListener("input", (event) => {
      topicNameQuery = event.target.value || "";
      topicPage = 0;
      renderTopics(lastTopics);
    });

    function parsePageSize(value) {
      const n = parseInt(value, 10);
      if (!Number.isFinite(n) || n < 1) return 10;
      return Math.min(200, n);
    }

    document.addEventListener("change", (event) => {
      const input = event.target.closest("[data-page-size]");
      if (!input) return;
      const size = parsePageSize(input.value);
      if (input.getAttribute("data-page-size") === "topic") {
        topicPageSize = size;
        topicPage = 0;
        renderTopics(lastTopics);
      } else {
        clientPageSize = size;
        clientPage = 0;
        renderClients(lastClients);
      }
    });

    function apiUrl(name) {
      const path = location.pathname.endsWith("/")
        ? location.pathname
        : location.pathname + "/";
      return new URL(name.replace(/^\//, ""), location.origin + path).toString();
    }

    async function refreshStatus() {
      try {
        const token = new URLSearchParams(location.search).get("token") || "";
        const headers = {};
        if (token) headers.Authorization = "Bearer " + token;
        const response = await fetch(apiUrl("status"), { cache: "no-store", headers });
        if (!response.ok) throw new Error("HTTP " + response.status);
        render(await response.json());
      } catch (error) {
        $("error").style.display = "block";
        $("error").textContent = "无法加载状态接口：" + error.message;
        $("meta").innerHTML = "<span>离线</span>";
      }
    }

    function authHeaders() {
      const token = new URLSearchParams(location.search).get("token") || "";
      const headers = {};
      if (token) headers.Authorization = "Bearer " + token;
      return headers;
    }

    async function apiRequest(path, options) {
      const opts = options || {};
      const url = new URL(apiUrl(path));
      if (opts.query) {
        Object.keys(opts.query).forEach((key) => {
          url.searchParams.set(key, opts.query[key]);
        });
      }
      const headers = authHeaders();
      if (opts.body !== undefined) headers["Content-Type"] = "application/json";
      const response = await fetch(url.toString(), {
        method: opts.method || "GET",
        headers,
        cache: "no-store",
        body: opts.body === undefined ? undefined : JSON.stringify(opts.body),
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    }

    function truncate(value, max) {
      const text = String(value == null ? "" : value);
      return text.length > max ? text.slice(0, max) + "…" : text;
    }

    function ttlLabel(seconds) {
      const s = Number(seconds);
      if (s === -2) return "不存在";
      if (s === -1) return "永不过期";
      if (s <= 0) return "已过期";
      return s + " 秒";
    }

    function cacheListHtml(entries) {
      if (!entries || !entries.length) return '<div class="empty">暂无缓存键</div>';
      const rows = entries.map((entry) =>
        '<tr><td class="mono">' + escapeHtml(entry.key) + '</td>' +
        '<td class="mono">' + escapeHtml(truncate(entry.value, 200)) + '</td>' +
        '<td>' + escapeHtml(entry.value_type || "string") + '</td>' +
        '<td>' + escapeHtml(ttlLabel(entry.ttl_seconds)) + '</td></tr>'
      ).join("");
      return '<div class="list"><table><thead><tr><th>键</th><th>值</th><th>类型</th><th>TTL</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    function lockListHtml(locks) {
      if (!locks || !locks.length) return '<div class="empty">暂无锁</div>';
      const rows = locks.map((lock) =>
        '<tr><td class="mono">' + escapeHtml(lock.lock_key) + '</td>' +
        '<td class="mono">' + escapeHtml(lock.owner) + '</td>' +
        '<td>' + escapeHtml(fmtTs(lock.expire_at)) + '</td>' +
        '<td>' + escapeHtml(fmtTs(lock.create_time)) + '</td></tr>'
      ).join("");
      return '<div class="list"><table><thead><tr><th>锁键</th><th>持有者</th><th>过期时间</th><th>创建时间</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    function setCacheResult(html) {
      $("cache-result").innerHTML = html;
    }

    function setLockResult(html) {
      $("lock-result").innerHTML = html;
    }

    async function loadCache() {
      try {
        const data = await apiRequest("cache/keys");
        $("cache-count").textContent = (data.entries || []).length;
        $("cache-list").innerHTML = cacheListHtml(data.entries || []);
      } catch (error) {
        $("cache-list").innerHTML = '<div class="empty">无法加载缓存：' + escapeHtml(error.message) + '</div>';
      }
    }

    async function loadLocks() {
      try {
        const data = await apiRequest("lock/list");
        $("lock-count").textContent = (data.locks || []).length;
        $("lock-list").innerHTML = lockListHtml(data.locks || []);
      } catch (error) {
        $("lock-list").innerHTML = '<div class="empty">无法加载锁：' + escapeHtml(error.message) + '</div>';
      }
    }

    async function cacheOp(op) {
      const key = $("cache-key").value.trim();
      const value = $("cache-value").value;
      const ttl = parseInt($("cache-ttl").value, 10) || 0;
      const delta = parseInt($("cache-delta").value, 10) || 1;
      setCacheResult('<span class="hint">正在处理…</span>');
      try {
        let data;
        if (op === "get") {
          if (!key) throw new Error("请输入键");
          data = await apiRequest("cache", { query: { key } });
          setCacheResult(
            '<span>键 <b>' + escapeHtml(data.key) + '</b></span> ' +
            (data.found
              ? '<span class="pill live">已命中</span><span>TTL ' + escapeHtml(ttlLabel(data.ttl_seconds)) + '</span>' +
                '<pre class="msg-payload">' + escapeHtml(data.value || "") + '</pre>'
              : '<span class="pill stale">未命中</span>')
          );
        } else if (op === "set") {
          if (!key) throw new Error("请输入键");
          data = await apiRequest("cache", { method: "PUT", body: { key, value, ttl_seconds: ttl } });
          setCacheResult('<span class="pill live">写入成功</span><span>键 <b>' + escapeHtml(data.key) + '</b></span>');
        } else if (op === "delete") {
          if (!key) throw new Error("请输入键");
          data = await apiRequest("cache", { method: "DELETE", query: { key } });
          setCacheResult('<span class="pill ' + (data.deleted ? "live" : "stale") + '">' + (data.deleted ? "已删除" : "未找到") + '</span>');
        } else if (op === "incr") {
          if (!key) throw new Error("请输入键");
          data = await apiRequest("cache/incr", { method: "POST", body: { key, delta, ttl_seconds: ttl } });
          setCacheResult('<span class="pill live">自增结果</span><b>' + escapeHtml(data.value) + '</b>');
        }
        loadCache();
      } catch (error) {
        setCacheResult('<span class="fail">操作失败：' + escapeHtml(error.message) + '</span>');
      }
    }

    async function lockOp(op) {
      const lockKey = $("lock-key").value.trim();
      const owner = $("lock-owner").value.trim();
      const ttl = parseInt($("lock-ttl").value, 10) || 0;
      setLockResult('<span class="hint">正在处理…</span>');
      try {
        let data;
        if (op === "get") {
          if (!lockKey) throw new Error("请输入锁键");
          data = await apiRequest("lock", { query: { lock_key: lockKey } });
          setLockResult(
            '<span>锁 <b>' + escapeHtml(data.lock_key) + '</b></span> ' +
            (data.locked ? '<span class="pill live">已锁定</span>' : '<span class="pill stale">未锁定</span>')
          );
        } else if (op === "acquire") {
          if (!lockKey || !owner) throw new Error("请输入锁键和持有者");
          if (ttl <= 0) throw new Error("TTL 必须大于 0");
          data = await apiRequest("lock/acquire", { method: "POST", body: { lock_key: lockKey, owner, ttl_seconds: ttl } });
          setLockResult(data.acquired
            ? '<span class="pill live">获取成功</span>'
            : '<span class="pill stale">获取失败（已被占用或不可用）</span>');
        } else if (op === "renew") {
          if (!lockKey || !owner) throw new Error("请输入锁键和持有者");
          if (ttl <= 0) throw new Error("TTL 必须大于 0");
          data = await apiRequest("lock/renew", { method: "POST", body: { lock_key: lockKey, owner, ttl_seconds: ttl } });
          setLockResult(data.renewed
            ? '<span class="pill live">续期成功</span>'
            : '<span class="pill stale">续期失败</span>');
        } else if (op === "release") {
          if (!lockKey || !owner) throw new Error("请输入锁键和持有者");
          data = await apiRequest("lock", { method: "DELETE", query: { lock_key: lockKey, owner } });
          setLockResult(data.released
            ? '<span class="pill live">释放成功</span>'
            : '<span class="pill stale">释放失败</span>');
        }
        loadLocks();
      } catch (error) {
        setLockResult('<span class="fail">操作失败：' + escapeHtml(error.message) + '</span>');
      }
    }

    async function refresh() {
      await refreshStatus();
      if (currentView() === "cache") loadCache();
      if (currentView() === "lock") loadLocks();
    }

    $("cache-refresh").addEventListener("click", loadCache);
    $("lock-refresh").addEventListener("click", loadLocks);
    document.addEventListener("click", (event) => {
      const cacheBtn = event.target.closest("[data-cache-op]");
      if (cacheBtn) {
        cacheOp(cacheBtn.getAttribute("data-cache-op"));
        return;
      }
      const lockBtn = event.target.closest("[data-lock-op]");
      if (lockBtn) {
        lockOp(lockBtn.getAttribute("data-lock-op"));
      }
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
