<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CANGLING BROKER · 运行状态</title>
  <script>
    (function () {
      var saved = localStorage.getItem("cl-broker-theme");
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root, html[data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2129;
      --line: #2a3440;
      --text: #e7ecf1;
      --muted: #8b98a5;
      --live: #3dd68c;
      --stale: #f0b429;
      --fail: #f07178;
      --pending: #59c2ff;
      --chip: #243040;
      --live-bg: #143d2c;
      --stale-bg: #3d3114;
      --hover: #222b35;
      --selected: #1c3348;
      --btn-hover: #243040;
    }
    html[data-theme="light"] {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #d8dee6;
      --text: #1b242c;
      --muted: #667585;
      --live: #178a54;
      --stale: #b58114;
      --fail: #c43d46;
      --pending: #1a7ab8;
      --chip: #e8eef4;
      --live-bg: #dff3e8;
      --stale-bg: #f8edd0;
      --hover: #eef3f8;
      --selected: #dceaf6;
      --btn-hover: #e8eef4;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0; }
    #build { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #meta { color: var(--muted); font-size: 13px; text-align: right; }
    #theme-toggle {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font: 12px/1.2 system-ui, sans-serif;
      white-space: nowrap;
    }
    #theme-toggle:hover { background: var(--btn-hover); }
    #error {
      display: none;
      margin: 8px 24px;
      padding: 8px 12px;
      border: 1px solid var(--fail);
      color: var(--fail);
      border-radius: 6px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 10px;
      padding: 12px 24px 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .card .label { color: var(--muted); font-size: 12px; }
    .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    section { padding: 0 24px 24px; }
    h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    .empty { color: var(--muted); padding: 16px 24px; }
    .pill {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--chip);
      color: var(--muted);
    }
    .live { background: var(--live-bg); color: var(--live); }
    .stale { background: var(--stale-bg); color: var(--stale); }
    .consumer { color: var(--muted); font-size: 12px; margin: 2px 0; }
    .url { color: var(--text); word-break: break-all; }
    .fail { color: var(--fail); }
    .pending { color: var(--pending); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .attr {
      display: inline-block;
      margin: 1px 4px 1px 0;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--chip);
      color: var(--muted);
      font-size: 11px;
    }
    .client-list { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .client-list table { border-radius: 0; }
    .client-list tr { cursor: pointer; }
    .client-list tr:hover td { background: var(--hover); }
    .client-list tr.selected td { background: var(--selected); }
    .client-detail {
      margin-top: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .client-detail .head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 14px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .client-detail .head .meta { color: var(--muted); font-size: 12px; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .section-head h2 { margin: 0; }
    .pager {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .pager .btns { display: flex; gap: 8px; }
    .pager button {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .pager button:hover { background: var(--btn-hover); }
    .pager button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="48" height="48">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F2FE"></stop>
            <stop offset="100%" stop-color="#3b82f6"></stop>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="36" height="36" rx="10" fill="var(--panel)" stroke="url(#logoGrad)" stroke-width="2"></rect>
        <path d="M 26 12 C 22 10 16 12 13 16 C 10 20 12 26 16 28 C 20 30 26 27 28 24" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round"></path>
        <circle cx="27" cy="14" r="3" fill="#00F2FE"></circle>
      </svg>
      <div>
        <h1>CANGLING BROKER</h1>
        <div id="build">正在加载版本…</div>
      </div>
    </div>
    <div class="toolbar">
      <div id="meta">正在加载…</div>
      <button type="button" id="theme-toggle" aria-label="切换主题">浅色</button>
    </div>
  </header>
  <div id="error"></div>
  <div class="cards" id="cards"></div>
  <section>
    <div class="section-head">
      <h2 id="clients-title">已连接客户端</h2>
    </div>
    <div id="clients"></div>
  </section>
  <section>
    <div class="section-head">
      <h2 id="topics-title">主题</h2>
    </div>
    <div id="topics"></div>
  </section>
  <script>
    const $ = (id) => document.getElementById(id);
    const THEME_KEY = "cl-broker-theme";

    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }

    function syncThemeButton() {
      const light = currentTheme() === "light";
      const button = $("theme-toggle");
      if (!button) return;
      button.textContent = light ? "深色" : "浅色";
      button.setAttribute("aria-label", light ? "切换到深色主题" : "切换到浅色主题");
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
      syncThemeButton();
    }

    $("theme-toggle").addEventListener("click", () => {
      setTheme(currentTheme() === "light" ? "dark" : "light");
    });
    syncThemeButton();
    const TOPIC_PAGE_SIZE = 30;
    const CLIENT_PAGE_SIZE = 10;
    let topicPage = 0;
    let clientPage = 0;
    let lastTopics = [];
    let lastClients = [];
    let selectedClientKey = "";

    function fmtBytes(n) {
      const bytes = Number(n) || 0;
      if (bytes < 1024) return bytes + " B";
      const units = ["KB", "MB", "GB", "TB"];
      let value = bytes / 1024;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      const digits = value >= 10 ? 0 : 1;
      return value.toFixed(digits) + " " + units[unit];
    }

    function fmtUptime(secs) {
      const s = Number(secs) || 0;
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h) return h + " 小时 " + m + " 分";
      if (m) return m + " 分 " + r + " 秒";
      return r + " 秒";
    }

    function card(label, value, cls) {
      return '<div class="card"><div class="label">' + label + '</div>' +
        '<div class="value' + (cls ? " " + cls : "") + '">' + value + "</div></div>";
    }

    function consumersHtml(list) {
      if (!list || !list.length) return '<div class="consumer">暂无消费者</div>';
      return list.map((c) => {
        const pill = c.live
          ? '<span class="pill live">在线</span>'
          : '<span class="pill stale">离线</span>';
        const attrs = attrsHtml(c.attributes);
        return '<div class="consumer">' + pill +
          ' <span class="url">' + escapeHtml(c.name || "(未命名)") + "</span>" +
          "<br>编号 " + escapeHtml(c.id) +
          " · 最近心跳 " + escapeHtml(fmtTs(c.last_seen_at)) +
          (attrs !== "—" ? "<br>" + attrs : "") + "</div>";
      }).join("");
    }

    function attrsHtml(attrs) {
      if (!attrs || typeof attrs !== "object") return "—";
      const keys = Object.keys(attrs);
      if (!keys.length) return "—";
      return keys.map((key) =>
        '<span class="attr">' + escapeHtml(key) + "=" + escapeHtml(attrs[key]) + "</span>"
      ).join("");
    }

    function fmtTs(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function clientKey(client) {
      return (client.protocol || "grpc") + "|" + (client.client_id || "") + "|" + (client.peer || "");
    }

    function clientType(protocol) {
      if (protocol === "mqtt-ws") return "MQTT-WS";
      if (protocol === "mqtt") return "MQTT";
      return "gRPC";
    }

    function renderClients(clients) {
      lastClients = clients;
      $("clients-title").textContent = "已连接客户端" + (clients.length ? " · " + clients.length : "");
      if (!clients.length) {
        selectedClientKey = "";
        $("clients").innerHTML = '<div class="empty">暂无已连接客户端</div>';
        return;
      }
      if (selectedClientKey && !clients.some((item) => clientKey(item) === selectedClientKey)) {
        selectedClientKey = "";
      }
      const pages = Math.max(1, Math.ceil(clients.length / CLIENT_PAGE_SIZE));
      if (clientPage >= pages) clientPage = pages - 1;
      if (clientPage < 0) clientPage = 0;
      const start = clientPage * CLIENT_PAGE_SIZE;
      const pageItems = clients.slice(start, start + CLIENT_PAGE_SIZE);
      const from = start + 1;
      const to = Math.min(clients.length, start + CLIENT_PAGE_SIZE);
      const rows = pageItems.map((client) => {
        const key = clientKey(client);
        const selected = key === selectedClientKey ? " selected" : "";
        return '<tr class="' + selected.trim() + '" data-client-key="' + escapeHtml(key) + '">' +
          '<td class="mono">' + escapeHtml(client.peer || "未知来源") + "</td>" +
          "<td><span class=\"pill\">" + escapeHtml(clientType(client.protocol)) + "</span></td>" +
          '<td class="mono">' + escapeHtml(client.client_id || "—") + "</td>" +
          "<td>" + (client.streams || (client.subscriptions || []).length) + "</td>" +
          "<td>" + escapeHtml(fmtTs(client.connected_at)) + "</td></tr>";
      }).join("");
      $("clients").innerHTML =
        '<div class="client-list"><table><thead><tr>' +
        "<th>地址</th><th>类型</th><th>客户端</th><th>订阅数</th><th>连接时间</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
        pagerBar(from, to, clients.length, clientPage + 1, pages, "client-page") +
        clientDetailHtml();
    }

    function clientDetailHtml() {
      if (!selectedClientKey) {
        return '<div class="empty">点击上表中的客户端查看订阅主题</div>';
      }
      const client = lastClients.find((item) => clientKey(item) === selectedClientKey);
      if (!client) return "";
      const subs = client.subscriptions || [];
      const rows = subs.map((sub) =>
        "<tr><td class=\"mono\">" + escapeHtml(sub.topic || "") + "</td>" +
        "<td>" + escapeHtml(sub.name || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(sub.id) + "</td>" +
        "<td>" + escapeHtml(fmtTs(sub.connected_at)) + "</td></tr>"
      ).join("");
      const body = rows
        ? "<table><thead><tr><th>订阅主题</th><th>名称</th><th>编号</th><th>订阅时间</th></tr></thead><tbody>" +
          rows + "</tbody></table>"
        : '<div class="empty">已连接，暂无订阅</div>';
      return '<div class="client-detail"><div class="head">' +
        '<span class="pill live">在线</span>' +
        '<span class="pill">' + escapeHtml(clientType(client.protocol)) + "</span>" +
        '<span class="mono url">' + escapeHtml(client.peer || "未知来源") + "</span>" +
        (client.client_id ? '<span class="mono url">' + escapeHtml(client.client_id) + "</span>" : "") +
        '<span class="meta">' + (subs.length) + " 个订阅</span></div>" + body + "</div>";
    }

    function pagerBar(from, to, total, page, pages, kind) {
      return '<div class="pager"><span>第 ' + from + "–" + to + " 条，共 " + total +
        " 条 · 第 " + page + "/" + pages + " 页</span>" +
        '<span class="btns">' +
        '<button type="button" data-' + kind + '="prev"' + (page <= 1 ? " disabled" : "") + ">上一页</button>" +
        '<button type="button" data-' + kind + '="next"' + (page >= pages ? " disabled" : "") + ">下一页</button>" +
        "</span></div>";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fmtBuildTime(value) {
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(value)) return value;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const pad = (n) => String(n).padStart(2, "0");
      return date.getUTCFullYear() + "-" +
        pad(date.getUTCMonth() + 1) + "-" +
        pad(date.getUTCDate()) + " " +
        pad(date.getUTCHours()) + ":" +
        pad(date.getUTCMinutes()) + ":" +
        pad(date.getUTCSeconds());
    }

    function buildLabel(data) {
      const version = data.version ? "v" + data.version : "";
      const git = data.git && data.git !== "unknown" ? data.git : "";
      const built = data.built && data.built !== "unknown" ? fmtBuildTime(data.built) : "";
      return [version, git, built ? "构建 " + built : ""].filter(Boolean).join(" · ") || "版本未知";
    }

    function render(data) {
      $("error").style.display = "none";
      $("build").textContent = buildLabel(data);
      $("meta").textContent = "已运行 " + fmtUptime(data.uptime_secs) + " · 刷新于 " +
        new Date().toLocaleTimeString();
      $("cards").innerHTML =
        card("主题数", data.topics) +
        card("客户端", (data.clients || []).length) +
        card("在线流", data.consumers) +
        card("已接收", data.accepted) +
        card("待处理", data.pending, data.pending ? "pending" : "") +
        card("投递中", data.processing) +
        card("已投递", data.delivered) +
        card("失败", data.failed, data.failed ? "fail" : "") +
        card("已丢弃", data.dropped || 0) +
        card("重复提交", data.duplicates) +
        card("SQLite", fmtBytes(data.db_bytes));

      renderClients(data.clients || []);
      renderTopics(data.topics_detail || []);
    }

    function topicsTable(pageItems) {
      return "<table><thead><tr>" +
        "<th>主题</th><th>投递</th><th>持久</th><th>已接收</th><th>待处理</th><th>投递中</th>" +
        "<th>已投递</th><th>失败</th><th>丢弃</th><th>重复</th><th>在线流</th><th>消费者</th>" +
        "</tr></thead><tbody>" +
        pageItems.map((t) =>
          "<tr><td>" + escapeHtml(t.name) + "</td>" +
          "<td>" + escapeHtml(t.delivery === "broadcast" ? "广播" : "单投") + "</td>" +
          "<td>" + escapeHtml(t.persistence === "ephemeral" ? "即弃" : "持久") + "</td>" +
          "<td>" + t.accepted + "</td>" +
          "<td>" + t.pending + "</td>" +
          "<td>" + t.processing + "</td>" +
          "<td>" + t.delivered + "</td>" +
          '<td class="' + (t.failed ? "fail" : "") + '">' + t.failed + "</td>" +
          "<td>" + (t.dropped || 0) + "</td>" +
          "<td>" + t.duplicates + "</td>" +
          "<td>" + (t.streams || 0) + "</td>" +
          "<td>" + consumersHtml(t.consumers) + "</td></tr>"
        ).join("") +
        "</tbody></table>";
    }

    function renderTopics(topics) {
      lastTopics = topics;
      $("topics-title").textContent = "主题" + (topics.length ? " · " + topics.length : "");
      if (!topics.length) {
        $("topics").innerHTML = '<div class="empty">暂无主题</div>';
        return;
      }
      const pages = Math.max(1, Math.ceil(topics.length / TOPIC_PAGE_SIZE));
      if (topicPage >= pages) topicPage = pages - 1;
      if (topicPage < 0) topicPage = 0;
      const start = topicPage * TOPIC_PAGE_SIZE;
      const from = start + 1;
      const to = Math.min(topics.length, start + TOPIC_PAGE_SIZE);
      $("topics").innerHTML = topicsTable(topics.slice(start, start + TOPIC_PAGE_SIZE)) +
        pagerBar(from, to, topics.length, topicPage + 1, pages, "topic-page");
    }

    document.addEventListener("click", (event) => {
      const row = event.target.closest("[data-client-key]");
      if (row) {
        const key = row.getAttribute("data-client-key") || "";
        selectedClientKey = selectedClientKey === key ? "" : key;
        renderClients(lastClients);
        return;
      }
      const clientBtn = event.target.closest("[data-client-page]");
      if (clientBtn && !clientBtn.disabled) {
        if (clientBtn.getAttribute("data-client-page") === "prev") clientPage -= 1;
        else clientPage += 1;
        renderClients(lastClients);
        return;
      }
      const topicBtn = event.target.closest("[data-topic-page]");
      if (topicBtn && !topicBtn.disabled) {
        if (topicBtn.getAttribute("data-topic-page") === "prev") topicPage -= 1;
        else topicPage += 1;
        renderTopics(lastTopics);
      }
    });

    function apiUrl(name) {
      const path = location.pathname.endsWith("/")
        ? location.pathname
        : location.pathname + "/";
      return new URL(name.replace(/^\//, ""), location.origin + path).toString();
    }

    async function refresh() {
      try {
        const token = new URLSearchParams(location.search).get("token") || "";
        const headers = {};
        if (token) headers.Authorization = "Bearer " + token;
        const response = await fetch(apiUrl("status"), { cache: "no-store", headers });
        if (!response.ok) throw new Error("HTTP " + response.status);
        render(await response.json());
      } catch (error) {
        $("error").style.display = "block";
        $("error").textContent = "无法加载状态接口：" + error.message;
        $("meta").textContent = "离线";
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
