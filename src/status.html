<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CANGLING BROKER · 运行状态</title>
  <script>
    (function () {
      var saved = localStorage.getItem("cl-broker-theme");
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root, html[data-theme="dark"] {
      --bg: #0f1419;
      --panel: #1a2129;
      --line: #2a3440;
      --text: #e7ecf1;
      --muted: #8b98a5;
      --live: #3dd68c;
      --stale: #f0b429;
      --fail: #f07178;
      --pending: #59c2ff;
      --chip: #243040;
      --live-bg: #143d2c;
      --stale-bg: #3d3114;
      --hover: #222b35;
      --selected: #1c3348;
      --btn-hover: #243040;
    }
    html[data-theme="light"] {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #d8dee6;
      --text: #1b242c;
      --muted: #667585;
      --live: #178a54;
      --stale: #b58114;
      --fail: #c43d46;
      --pending: #1a7ab8;
      --chip: #e8eef4;
      --live-bg: #dff3e8;
      --stale-bg: #f8edd0;
      --hover: #eef3f8;
      --selected: #dceaf6;
      --btn-hover: #e8eef4;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0; }
    #build { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #meta { color: var(--muted); font-size: 13px; text-align: right; }
    #theme-toggle {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font: 12px/1.2 system-ui, sans-serif;
      white-space: nowrap;
    }
    #theme-toggle:hover { background: var(--btn-hover); }
    #error {
      display: none;
      margin: 8px 24px;
      padding: 8px 12px;
      border: 1px solid var(--fail);
      color: var(--fail);
      border-radius: 6px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 10px;
      padding: 12px 24px 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .card .label { color: var(--muted); font-size: 12px; }
    .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    section { padding: 0; }
    h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
    .tabs-wrap { padding: 0 24px 24px; }
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .tabs button {
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 8px 14px;
      cursor: pointer;
      font: 13px/1.2 system-ui, sans-serif;
      margin-bottom: -1px;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active {
      color: var(--text);
      border-bottom-color: var(--pending);
      font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    th.seq, td.seq {
      width: 1%;
      white-space: nowrap;
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    tr:last-child td { border-bottom: 0; }
    .empty { color: var(--muted); padding: 16px 24px; }
    .pill {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--chip);
      color: var(--muted);
    }
    .live { background: var(--live-bg); color: var(--live); }
    .stale { background: var(--stale-bg); color: var(--stale); }
    .url { color: var(--text); word-break: break-all; }
    .fail { color: var(--fail); }
    .pending { color: var(--pending); }
    .topic-list td.zero { color: var(--muted); opacity: 0.4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .attr {
      display: inline-block;
      margin: 1px 4px 1px 0;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--chip);
      color: var(--muted);
      font-size: 11px;
    }
    .client-list, .topic-list { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .client-list table, .topic-list table { border-radius: 0; }
    .client-list tr, .topic-list tr { cursor: pointer; }
    .client-list tr:hover td, .topic-list tr:hover td { background: var(--hover); }
    .client-list tr.selected td, .topic-list tr.selected td { background: var(--selected); }
    .hint { color: var(--muted); font-size: 12px; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(15, 20, 25, 0.55);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 8vh 16px 24px;
    }
    html[data-theme="light"] .modal { background: rgba(27, 36, 44, 0.35); }
    .modal[hidden] { display: none; }
    .modal-panel {
      width: min(920px, 100%);
      max-height: 80vh;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h2 {
      margin: 0;
      color: var(--text);
      font-size: 16px;
      word-break: break-all;
    }
    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .modal-close {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .modal-close:hover { background: var(--btn-hover); }
    .modal-body { overflow: auto; }
    .msg-view {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .msg-view h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .msg-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin-bottom: 8px;
    }
    .msg-toolbar .btns { display: flex; gap: 8px; }
    .msg-toolbar button {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .msg-toolbar button:hover { background: var(--btn-hover); }
    .msg-toolbar button:disabled { opacity: 0.4; cursor: default; }
    .msg-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .msg-payload {
      margin: 0;
      padding: 10px 12px;
      background: var(--chip);
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 260px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .client-detail {
      margin-top: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .client-detail .head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 14px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .client-detail .head .meta { color: var(--muted); font-size: 12px; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .section-head h2 { margin: 0; }
    .pager {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .pager.top { margin-top: 0; }
    .pager.bottom { margin-bottom: 0; }
    .pager .btns { display: flex; gap: 8px; }
    .pager button {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .pager button:hover { background: var(--btn-hover); }
    .pager button:disabled { opacity: 0.4; cursor: default; }
    .table-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      margin-bottom: 10px;
    }
    .table-tools label {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 360px;
      color: var(--muted);
      font-size: 13px;
    }
    .table-tools label span {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .table-tools select,
    .table-tools input {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font: 13px/1.3 system-ui, sans-serif;
    }
    .table-tools input {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
    }
    .table-tools select { flex: 0 0 auto; }
    .table-tools select:focus,
    .table-tools input:focus {
      outline: 1px solid var(--pending);
      border-color: var(--pending);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="48" height="48">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F2FE"></stop>
            <stop offset="100%" stop-color="#3b82f6"></stop>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="36" height="36" rx="10" fill="var(--panel)" stroke="url(#logoGrad)" stroke-width="2"></rect>
        <path d="M 26 12 C 22 10 16 12 13 16 C 10 20 12 26 16 28 C 20 30 26 27 28 24" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round"></path>
        <circle cx="27" cy="14" r="3" fill="#00F2FE"></circle>
      </svg>
      <div>
        <h1>CANGLING BROKER</h1>
        <div id="build">正在加载版本…</div>
      </div>
    </div>
    <div class="toolbar">
      <div id="meta">正在加载…</div>
      <button type="button" id="theme-toggle" aria-label="切换主题">浅色</button>
    </div>
  </header>
  <div id="error"></div>
  <div class="cards" id="cards"></div>
  <div class="tabs-wrap">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-clients" data-tab="clients" aria-controls="panel-clients" aria-selected="true" class="active">已连接客户端</button>
      <button type="button" role="tab" id="tab-topics" data-tab="topics" aria-controls="panel-topics" aria-selected="false">主题</button>
    </div>
    <section id="panel-clients" role="tabpanel" aria-labelledby="tab-clients">
      <div class="table-tools">
        <label><span>连接类型</span>
          <select id="client-type-filter" aria-label="按连接类型筛选">
            <option value="">全部</option>
            <option value="grpc">gRPC</option>
            <option value="mqtt">MQTT</option>
            <option value="mqtt-ws">MQTT-WS</option>
          </select>
        </label>
      </div>
      <div id="clients"></div>
    </section>
    <section id="panel-topics" role="tabpanel" aria-labelledby="tab-topics" hidden>
      <div class="table-tools">
        <label><span>主题名</span>
          <input id="topic-name-filter" type="search" placeholder="模糊搜索，空格分隔多个词" aria-label="模糊搜索主题名">
        </label>
      </div>
      <div id="topics"></div>
    </section>
  </div>
  <div id="topic-modal" class="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="topic-modal-title">
      <div class="modal-head">
        <div>
          <h2 id="topic-modal-title">主题</h2>
          <div id="topic-modal-meta" class="modal-meta"></div>
        </div>
        <button type="button" class="modal-close" data-close-topic-modal aria-label="关闭">关闭</button>
      </div>
      <div id="topic-modal-body" class="modal-body"></div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const THEME_KEY = "cl-broker-theme";
    const TAB_KEY = "cl-broker-tab";

    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }

    function syncThemeButton() {
      const light = currentTheme() === "light";
      const button = $("theme-toggle");
      if (!button) return;
      button.textContent = light ? "深色" : "浅色";
      button.setAttribute("aria-label", light ? "切换到深色主题" : "切换到浅色主题");
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
      syncThemeButton();
    }

    $("theme-toggle").addEventListener("click", () => {
      setTheme(currentTheme() === "light" ? "dark" : "light");
    });
    syncThemeButton();

    function setTab(name) {
      const tab = name === "topics" ? "topics" : "clients";
      try { localStorage.setItem(TAB_KEY, tab); } catch (_) {}
      document.querySelectorAll("[data-tab]").forEach((btn) => {
        const on = btn.getAttribute("data-tab") === tab;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-selected", on ? "true" : "false");
      });
      $("panel-clients").hidden = tab !== "clients";
      $("panel-topics").hidden = tab !== "topics";
      if (location.hash !== "#" + tab) {
        history.replaceState(null, "", "#" + tab);
      }
    }

    document.querySelector(".tabs").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-tab]");
      if (btn) setTab(btn.getAttribute("data-tab"));
    });
    window.addEventListener("hashchange", () => {
      const hash = location.hash.replace("#", "");
      if (hash === "topics" || hash === "clients") setTab(hash);
    });
    (function initTab() {
      const hash = location.hash.replace("#", "");
      if (hash === "topics" || hash === "clients") {
        setTab(hash);
        return;
      }
      try {
        const savedTab = localStorage.getItem(TAB_KEY);
        if (savedTab === "topics" || savedTab === "clients") {
          setTab(savedTab);
          return;
        }
      } catch (_) {}
      setTab("clients");
    })();

    const TOPIC_PAGE_SIZE = 30;
    const CLIENT_PAGE_SIZE = 10;
    let topicPage = 0;
    let clientPage = 0;
    let lastTopics = [];
    let lastClients = [];
    let selectedClientKey = "";
    let selectedTopicName = "";
    let clientTypeFilter = "";
    let topicNameQuery = "";
    let messageOffset = 0;
    let messageTopic = "";

    function fmtBytes(n) {
      const bytes = Number(n) || 0;
      if (bytes < 1024) return bytes + " B";
      const units = ["KB", "MB", "GB", "TB"];
      let value = bytes / 1024;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      const digits = value >= 10 ? 0 : 1;
      return value.toFixed(digits) + " " + units[unit];
    }

    function fmtUptime(secs) {
      const s = Math.max(0, Math.floor(Number(secs) || 0));
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (d) return d + " 天 " + h + " 小时";
      if (h) return h + " 小时 " + m + " 分";
      if (m) return m + " 分 " + r + " 秒";
      return r + " 秒";
    }

    function fmtSince(value) {
      if (value == null || value === "") return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return fmtUptime((Date.now() - date.getTime()) / 1000);
    }

    function card(label, value, cls) {
      return '<div class="card"><div class="label">' + label + '</div>' +
        '<div class="value' + (cls ? " " + cls : "") + '">' + value + "</div></div>";
    }

    function consumerSummary(list) {
      const total = (list || []).length;
      if (!total) return '<span class="hint">暂无</span>';
      const live = list.filter((c) => c.live).length;
      const stale = total - live;
      return '<span class="pill live">' + live + " 在线</span>" +
        (stale ? ' <span class="pill stale">' + stale + " 离线</span>" : "") +
        ' <span class="hint">点击查看</span>';
    }

    function consumersTable(list) {
      if (!list || !list.length) return '<div class="empty">暂无消费者</div>';
      const rows = list.map((c, i) =>
        '<tr><td class="seq">' + (i + 1) + "</td>" +
        "<td>" + (c.live
          ? '<span class="pill live">在线</span>'
          : '<span class="pill stale">离线</span>') + "</td>" +
        '<td class="url">' + escapeHtml(c.name || "(未命名)") + "</td>" +
        '<td class="mono">' + escapeHtml(c.id) + "</td>" +
        "<td>" + escapeHtml(fmtTs(c.last_seen_at)) + "</td>" +
        "<td>" + attrsHtml(c.attributes) + "</td></tr>"
      ).join("");
      return "<table><thead><tr>" +
        "<th class=\"seq\">序号</th><th>状态</th><th>名称</th><th>编号</th><th>最近心跳</th><th>属性</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table>";
    }

    function closeTopicModal() {
      selectedTopicName = "";
      messageTopic = "";
      messageOffset = 0;
      $("topic-modal").hidden = true;
    }

    function messageStatusLabel(status) {
      if (status === "pending") return "待处理";
      if (status === "processing") return "投递中";
      if (status === "delivered") return "已投递";
      if (status === "failed") return "失败";
      if (status === "dropped") return "已丢弃";
      return status || "—";
    }

    function messageViewerHtml(html) {
      return '<div id="topic-message" class="msg-view">' + html + "</div>";
    }

    function renderTopicMessage(data) {
      const box = $("topic-message");
      if (!box) return;
      const total = Number(data.total) || 0;
      const offset = Number(data.offset) || 0;
      const index = total ? offset + 1 : 0;
      const newerDisabled = offset <= 0 ? " disabled" : "";
      const olderDisabled = !total || offset >= total - 1 ? " disabled" : "";
      const toolbar =
        '<div class="msg-toolbar"><h3>消息</h3><span>' +
        (total ? ("第 " + index + " / " + total + " 条") : "0 条") +
        '</span><span class="btns">' +
        '<button type="button" data-msg-nav="newer"' + newerDisabled + ">较新</button>" +
        '<button type="button" data-msg-nav="older"' + olderDisabled + ">较旧</button>" +
        "</span></div>";
      if (!data.message) {
        box.innerHTML = toolbar + '<div class="empty">暂无已保存消息</div>';
        return;
      }
      const msg = data.message;
      const encoding = msg.payload_encoding === "base64" ? "base64" : "utf-8";
      box.innerHTML = toolbar +
        '<div class="msg-meta">' +
        '<span class="pill">' + escapeHtml(messageStatusLabel(msg.status)) + "</span>" +
        '<span class="mono">' + escapeHtml(msg.id) + "</span>" +
        (msg.topic && msg.topic !== selectedTopicName
          ? '<span class="mono">' + escapeHtml(msg.topic) + "</span>"
          : "") +
        "<span>入队 " + escapeHtml(fmtTs(msg.created_at)) + "</span>" +
        (msg.delivered_at ? "<span>投递 " + escapeHtml(fmtTs(msg.delivered_at)) + "</span>" : "") +
        "<span>尝试 " + (msg.attempts || 0) + " 次</span>" +
        (msg.truncated ? "<span>内容已截断</span>" : "") +
        (encoding === "base64" ? "<span>二进制</span>" : "") +
        "</div>" +
        (attrsHtml(msg.attributes) !== "—" ? "<div>" + attrsHtml(msg.attributes) + "</div>" : "") +
        (msg.last_error ? '<div class="fail">' + escapeHtml(msg.last_error) + "</div>" : "") +
        '<pre class="msg-payload">' + escapeHtml(msg.payload || "") + "</pre>";
    }

    async function loadTopicMessage(topic, offset) {
      const box = $("topic-message");
      if (box) box.innerHTML = '<div class="empty">正在加载消息…</div>';
      try {
        const url = new URL(apiUrl("messages"));
        url.searchParams.set("topic", topic);
        url.searchParams.set("offset", String(offset));
        const token = new URLSearchParams(location.search).get("token") || "";
        if (token) url.searchParams.set("token", token);
        const headers = {};
        if (token) headers.Authorization = "Bearer " + token;
        const response = await fetch(url.toString(), { cache: "no-store", headers });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (selectedTopicName !== topic) return;
        messageOffset = Number(data.offset) || 0;
        renderTopicMessage(data);
      } catch (error) {
        const current = $("topic-message");
        if (current) {
          current.innerHTML = '<div class="empty">无法加载消息：' + escapeHtml(error.message) + "</div>";
        }
      }
    }

    function fillTopicModal() {
      const modal = $("topic-modal");
      if (!selectedTopicName) {
        modal.hidden = true;
        return;
      }
      const topic = lastTopics.find((item) => item.name === selectedTopicName);
      if (!topic) {
        closeTopicModal();
        return;
      }
      $("topic-modal-title").textContent = topic.name;
      const consumers = topic.consumers || [];
      const live = consumers.filter((c) => c.live).length;
      $("topic-modal-meta").innerHTML =
        '<span class="pill">' + escapeHtml(topic.delivery === "broadcast" ? "广播" : "单投") + "</span>" +
        '<span class="pill">' + escapeHtml(topic.persistence === "ephemeral" ? "即弃" : "持久") + "</span>" +
        '<span class="pill live">' + live + " 在线</span>" +
        '<span>' + consumers.length + " 个消费者</span>" +
        '<span>' + (topic.streams || 0) + " 条在线流</span>";
      const body = $("topic-modal-body");
      const top = body.scrollTop;
      const persistent = topic.persistence !== "ephemeral";
      const consumersBlock = consumersTable(consumers);
      if (!persistent) {
        messageTopic = "";
        messageOffset = 0;
        body.innerHTML = messageViewerHtml('<div class="empty">即弃主题不保存消息</div>') + consumersBlock;
      } else {
        const existing = $("topic-message");
        const sameTopic = messageTopic === topic.name && existing;
        body.innerHTML = (sameTopic ? existing.outerHTML : messageViewerHtml('<div class="empty">正在加载消息…</div>')) +
          consumersBlock;
        if (!sameTopic) {
          messageTopic = topic.name;
          messageOffset = 0;
          loadTopicMessage(topic.name, 0);
        }
      }
      body.scrollTop = top;
      modal.hidden = false;
    }

    function attrsHtml(attrs) {
      if (!attrs || typeof attrs !== "object") return "—";
      const keys = Object.keys(attrs);
      if (!keys.length) return "—";
      return keys.map((key) =>
        '<span class="attr">' + escapeHtml(key) + "=" + escapeHtml(attrs[key]) + "</span>"
      ).join("");
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function fmtTs(value) {
      if (value == null || value === "") return "—";
      if (typeof value === "string" && /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(value)) {
        return value;
      }
      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.getFullYear() + "-" +
        pad2(date.getMonth() + 1) + "-" +
        pad2(date.getDate()) + " " +
        pad2(date.getHours()) + ":" +
        pad2(date.getMinutes()) + ":" +
        pad2(date.getSeconds());
    }

    function clientKey(client) {
      return (client.protocol || "grpc") + "|" + (client.host || "") + "|" +
        (client.client_id || "") + "|" + (client.peer || "");
    }

    function clientType(protocol) {
      if (protocol === "mqtt-ws") return "MQTT-WS";
      if (protocol === "mqtt") return "MQTT";
      return "gRPC";
    }

    function fuzzyMatch(text, query) {
      const raw = String(query || "").trim().toLowerCase();
      if (!raw) return true;
      const hay = String(text || "").toLowerCase();
      if (hay.includes(raw)) return true;
      return raw.split(/\s+/).every((token) => token && hay.includes(token));
    }

    function filteredClients(clients) {
      if (!clientTypeFilter) return clients;
      return clients.filter((item) => (item.protocol || "grpc") === clientTypeFilter);
    }

    function filteredTopics(topics) {
      if (!topicNameQuery.trim()) return topics;
      return topics.filter((item) => fuzzyMatch(item.name, topicNameQuery));
    }

    function renderClients(clients) {
      lastClients = clients;
      $("tab-clients").textContent = "已连接客户端" + (clients.length ? " · " + clients.length : "");
      const shown = filteredClients(clients);
      if (!clients.length) {
        selectedClientKey = "";
        $("clients").innerHTML = '<div class="empty">暂无已连接客户端</div>';
        return;
      }
      if (!shown.length) {
        $("clients").innerHTML = '<div class="empty">无匹配该连接类型的客户端</div>';
        return;
      }
      if (selectedClientKey && !shown.some((item) => clientKey(item) === selectedClientKey)) {
        selectedClientKey = "";
      }
      const pages = Math.max(1, Math.ceil(shown.length / CLIENT_PAGE_SIZE));
      if (clientPage >= pages) clientPage = pages - 1;
      if (clientPage < 0) clientPage = 0;
      const start = clientPage * CLIENT_PAGE_SIZE;
      const pageItems = shown.slice(start, start + CLIENT_PAGE_SIZE);
      const from = start + 1;
      const to = Math.min(shown.length, start + CLIENT_PAGE_SIZE);
      const rows = pageItems.map((client, i) => {
        const key = clientKey(client);
        const selected = key === selectedClientKey ? " selected" : "";
        return '<tr class="' + selected.trim() + '" data-client-key="' + escapeHtml(key) + '">' +
          '<td class="seq">' + (start + i + 1) + "</td>" +
          '<td class="mono">' + escapeHtml(client.host || "—") + "</td>" +
          '<td class="mono">' + escapeHtml(client.peer || "未知来源") + "</td>" +
          "<td><span class=\"pill\">" + escapeHtml(clientType(client.protocol)) + "</span></td>" +
          '<td class="mono">' + escapeHtml(client.client_id || "—") + "</td>" +
          '<td class="mono">' + escapeHtml(client.version || "—") + "</td>" +
          "<td>" + (client.streams || (client.subscriptions || []).length) + "</td>" +
          "<td>" + escapeHtml(fmtSince(client.connected_at)) + "</td></tr>";
      }).join("");
      const table =
        '<div class="client-list"><table><thead><tr>' +
        "<th class=\"seq\">序号</th><th>主机</th><th>地址</th><th>类型</th><th>客户端</th><th>版本</th><th>订阅数</th><th>连接时长</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table></div>";
      $("clients").innerHTML =
        withPagers(table, from, to, shown.length, clientPage + 1, pages, "client-page") +
        clientDetailHtml();
    }

    function clientDetailHtml() {
      if (!selectedClientKey) {
        return '<div class="empty">点击上表中的客户端查看订阅主题</div>';
      }
      const client = lastClients.find((item) => clientKey(item) === selectedClientKey);
      if (!client) return "";
      const subs = client.subscriptions || [];
      const rows = subs.map((sub, i) =>
        '<tr><td class="seq">' + (i + 1) + "</td>" +
        "<td class=\"mono\">" + escapeHtml(sub.topic || "") + "</td>" +
        "<td>" + escapeHtml(sub.name || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(sub.id) + "</td>" +
        "<td>" + escapeHtml(fmtTs(sub.connected_at)) + "</td></tr>"
      ).join("");
      const body = rows
        ? "<table><thead><tr><th class=\"seq\">序号</th><th>订阅主题</th><th>名称</th><th>编号</th><th>订阅时间</th></tr></thead><tbody>" +
          rows + "</tbody></table>"
        : '<div class="empty">已连接，暂无订阅</div>';
      return '<div class="client-detail"><div class="head">' +
        '<span class="pill live">在线</span>' +
        '<span class="pill">' + escapeHtml(clientType(client.protocol)) + "</span>" +
        (client.host ? '<span class="mono url">' + escapeHtml(client.host) + "</span>" : "") +
        '<span class="mono url">' + escapeHtml(client.peer || "未知来源") + "</span>" +
        (client.client_id ? '<span class="mono url">' + escapeHtml(client.client_id) + "</span>" : "") +
        (client.version ? '<span class="pill">' + escapeHtml(client.version) + "</span>" : "") +
        '<span class="meta">' + (subs.length) + " 个订阅</span></div>" + body + "</div>";
    }

    function pagerBar(from, to, total, page, pages, kind, pos) {
      return '<div class="pager ' + (pos || "") + '"><span>第 ' + from + "–" + to + " 条，共 " + total +
        " 条 · 第 " + page + "/" + pages + " 页</span>" +
        '<span class="btns">' +
        '<button type="button" data-' + kind + '="prev"' + (page <= 1 ? " disabled" : "") + ">上一页</button>" +
        '<button type="button" data-' + kind + '="next"' + (page >= pages ? " disabled" : "") + ">下一页</button>" +
        "</span></div>";
    }

    function withPagers(tableHtml, from, to, total, page, pages, kind) {
      return pagerBar(from, to, total, page, pages, kind, "top") +
        tableHtml +
        pagerBar(from, to, total, page, pages, kind, "bottom");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildLabel(data) {
      const version = data.version ? "v" + data.version : "";
      const git = data.git && data.git !== "unknown" ? data.git : "";
      const built = data.built && data.built !== "unknown" ? fmtTs(data.built) : "";
      return [version, git, built ? "构建 " + built : ""].filter(Boolean).join(" · ") || "版本未知";
    }

    function render(data) {
      $("error").style.display = "none";
      $("build").textContent = buildLabel(data);
      $("meta").textContent = "已运行 " + fmtUptime(data.uptime_secs) + " · 刷新于 " +
        fmtTs(new Date());
      $("cards").innerHTML =
        card("主题数", data.topics) +
        card("客户端", (data.clients || []).length) +
        card("在线流", data.consumers) +
        card("已接收", data.accepted) +
        card("待处理", data.pending, data.pending ? "pending" : "") +
        card("投递中", data.processing) +
        card("已投递", data.delivered) +
        card("失败", data.failed, data.failed ? "fail" : "") +
        card("已丢弃", data.dropped || 0) +
        card("重复提交", data.duplicates) +
        card("SQLite", fmtBytes(data.db_bytes));

      renderClients(data.clients || []);
      renderTopics(data.topics_detail || []);
    }

    function numCell(value, extra) {
      const n = Number(value) || 0;
      const cls = [n === 0 ? "zero" : "", extra || ""].filter(Boolean).join(" ");
      return "<td" + (cls ? ' class="' + cls + '"' : "") + ">" + n + "</td>";
    }

    function topicsTable(pageItems, start) {
      const rows = pageItems.map((t, i) => {
        const selected = t.name === selectedTopicName ? " selected" : "";
        return '<tr class="' + selected.trim() + '" data-topic-name="' + escapeHtml(t.name) + '">' +
          '<td class="seq">' + (start + i + 1) + "</td>" +
          "<td>" + escapeHtml(t.name) + "</td>" +
          "<td>" + escapeHtml(t.delivery === "broadcast" ? "广播" : "单投") + "</td>" +
          "<td>" + escapeHtml(t.persistence === "ephemeral" ? "即弃" : "持久") + "</td>" +
          numCell(t.accepted) +
          numCell(t.pending) +
          numCell(t.processing) +
          numCell(t.delivered) +
          numCell(t.failed, t.failed ? "fail" : "") +
          numCell(t.dropped) +
          numCell(t.duplicates) +
          numCell(t.streams) +
          "<td>" + consumerSummary(t.consumers) + "</td></tr>";
      }).join("");
      return '<div class="topic-list"><table><thead><tr>' +
        "<th class=\"seq\">序号</th><th>主题</th><th>投递</th><th>持久</th><th>已接收</th><th>待处理</th><th>投递中</th>" +
        "<th>已投递</th><th>失败</th><th>丢弃</th><th>重复</th><th>在线流</th><th>消费者</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    }

    function renderTopics(topics) {
      lastTopics = topics;
      $("tab-topics").textContent = "主题" + (topics.length ? " · " + topics.length : "");
      const shown = filteredTopics(topics);
      if (!topics.length) {
        $("topics").innerHTML = '<div class="empty">暂无主题</div>';
        fillTopicModal();
        return;
      }
      if (!shown.length) {
        $("topics").innerHTML = '<div class="empty">无匹配主题</div>';
        fillTopicModal();
        return;
      }
      const pages = Math.max(1, Math.ceil(shown.length / TOPIC_PAGE_SIZE));
      if (topicPage >= pages) topicPage = pages - 1;
      if (topicPage < 0) topicPage = 0;
      const start = topicPage * TOPIC_PAGE_SIZE;
      const from = start + 1;
      const to = Math.min(shown.length, start + TOPIC_PAGE_SIZE);
      $("topics").innerHTML = withPagers(
        topicsTable(shown.slice(start, start + TOPIC_PAGE_SIZE), start),
        from, to, shown.length, topicPage + 1, pages, "topic-page"
      );
      fillTopicModal();
    }

    document.addEventListener("click", (event) => {
      const nav = event.target.closest("[data-msg-nav]");
      if (nav && !nav.disabled && selectedTopicName) {
        if (nav.getAttribute("data-msg-nav") === "older") messageOffset += 1;
        else messageOffset = Math.max(0, messageOffset - 1);
        loadTopicMessage(selectedTopicName, messageOffset);
        return;
      }
      if (event.target.closest("[data-close-topic-modal]")) {
        closeTopicModal();
        renderTopics(lastTopics);
        return;
      }
      const modal = $("topic-modal");
      if (modal && !modal.hidden && event.target === modal) {
        closeTopicModal();
        renderTopics(lastTopics);
        return;
      }
      const topicRow = event.target.closest("[data-topic-name]");
      if (topicRow) {
        const name = topicRow.getAttribute("data-topic-name") || "";
        selectedTopicName = selectedTopicName === name ? "" : name;
        renderTopics(lastTopics);
        return;
      }
      const row = event.target.closest("[data-client-key]");
      if (row) {
        const key = row.getAttribute("data-client-key") || "";
        selectedClientKey = selectedClientKey === key ? "" : key;
        renderClients(lastClients);
        return;
      }
      const clientBtn = event.target.closest("[data-client-page]");
      if (clientBtn && !clientBtn.disabled) {
        if (clientBtn.getAttribute("data-client-page") === "prev") clientPage -= 1;
        else clientPage += 1;
        renderClients(lastClients);
        return;
      }
      const topicBtn = event.target.closest("[data-topic-page]");
      if (topicBtn && !topicBtn.disabled) {
        if (topicBtn.getAttribute("data-topic-page") === "prev") topicPage -= 1;
        else topicPage += 1;
        renderTopics(lastTopics);
      }
    });

    document.addEventListener("keydown", (event) => {
      if ($("topic-modal").hidden) return;
      const typing = event.target && /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName);
      if (event.key === "Escape") {
        closeTopicModal();
        renderTopics(lastTopics);
        return;
      }
      if (typing || !selectedTopicName) return;
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        messageOffset += 1;
        loadTopicMessage(selectedTopicName, messageOffset);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        messageOffset = Math.max(0, messageOffset - 1);
        loadTopicMessage(selectedTopicName, messageOffset);
      }
    });

    $("client-type-filter").addEventListener("change", (event) => {
      clientTypeFilter = event.target.value || "";
      clientPage = 0;
      renderClients(lastClients);
    });
    $("topic-name-filter").addEventListener("input", (event) => {
      topicNameQuery = event.target.value || "";
      topicPage = 0;
      renderTopics(lastTopics);
    });

    function apiUrl(name) {
      const path = location.pathname.endsWith("/")
        ? location.pathname
        : location.pathname + "/";
      return new URL(name.replace(/^\//, ""), location.origin + path).toString();
    }

    async function refresh() {
      try {
        const token = new URLSearchParams(location.search).get("token") || "";
        const headers = {};
        if (token) headers.Authorization = "Bearer " + token;
        const response = await fetch(apiUrl("status"), { cache: "no-store", headers });
        if (!response.ok) throw new Error("HTTP " + response.status);
        render(await response.json());
      } catch (error) {
        $("error").style.display = "block";
        $("error").textContent = "无法加载状态接口：" + error.message;
        $("meta").textContent = "离线";
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
