<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455A64"/>
    </marker>
  </defs>

  <!-- white background for consistent rendering on any theme -->
  <rect x="0" y="0" width="1080" height="630" fill="#FFFFFF"/>

  <!-- ============ nodes ============ -->
  <rect x="40" y="150" width="160" height="64" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
  <text x="120" y="178" font-size="15" font-weight="bold" text-anchor="middle" fill="#0D47A1">AcceptMessages</text>
  <text x="120" y="199" font-size="12" text-anchor="middle" fill="#1565C0">(accept / enqueue)</text>

  <rect x="300" y="150" width="150" height="64" rx="10" fill="#FFF8E1" stroke="#FBC02D" stroke-width="2"/>
  <text x="375" y="182" font-size="15" font-weight="bold" text-anchor="middle" fill="#F57F17">pending</text>
  <text x="375" y="202" font-size="11" text-anchor="middle" fill="#9E9D24">(待投递)</text>

  <rect x="550" y="150" width="150" height="64" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
  <text x="625" y="182" font-size="15" font-weight="bold" text-anchor="middle" fill="#0D47A1">processing</text>
  <text x="625" y="202" font-size="11" text-anchor="middle" fill="#1565C0">(投递中)</text>

  <rect x="820" y="150" width="160" height="64" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="900" y="178" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B5E20">delivered</text>
  <text x="900" y="199" font-size="12" text-anchor="middle" fill="#2E7D32">(成功, 可清理)</text>

  <rect x="550" y="360" width="150" height="64" rx="10" fill="#FFEBEE" stroke="#E53935" stroke-width="2"/>
  <text x="625" y="388" font-size="15" font-weight="bold" text-anchor="middle" fill="#B71C1C">failed</text>
  <text x="625" y="408" font-size="11" text-anchor="middle" fill="#C62828">(attempts+1, 达上限)</text>

  <!-- ============ arrows + concise labels ============ -->
  <!-- AcceptMessages -> pending -->
  <line x1="200" y1="182" x2="296" y2="182" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="248" y="166" font-size="12" text-anchor="middle" fill="#455A64">enqueue</text>

  <!-- pending -> processing -->
  <line x1="450" y1="182" x2="546" y2="182" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="166" font-size="12" text-anchor="middle" fill="#455A64">claim</text>

  <!-- processing -> delivered -->
  <line x1="700" y1="182" x2="816" y2="182" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="758" y="166" font-size="12" text-anchor="middle" fill="#455A64">Ack(success)</text>

  <!-- processing -> failed -->
  <line x1="625" y1="214" x2="625" y2="356" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="634" y="292" font-size="12" text-anchor="start" fill="#455A64">超时</text>

  <!-- failed -> pending (retry) -->
  <path d="M 625,424 L 625,460 L 375,460 L 375,218" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="484" font-size="12" text-anchor="middle" fill="#455A64">重试</text>

  <!-- processing -> pending (reclaim_stale) -->
  <path d="M 625,150 L 625,100 L 375,100 L 375,146" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="88" font-size="12" text-anchor="middle" fill="#455A64">reclaim_stale()</text>

  <!-- ============ legend ============ -->
  <rect x="40" y="510" width="1000" height="100" rx="10" fill="#F7F9FA" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="60" y="535" font-size="12.5" fill="#37474F">enqueue：idempotency_key 去重</text>
  <text x="60" y="568" font-size="12.5" fill="#37474F">claim：事务置 processing + lease + next_attempt_at</text>
  <text x="420" y="535" font-size="12.5" fill="#37474F">Ack(success)：AckMessage 成功确认，可清理</text>
  <text x="420" y="568" font-size="12.5" fill="#37474F">超时：attempts+1，达上限</text>
  <text x="760" y="535" font-size="12.5" fill="#37474F">reclaim_stale()：超时未 ack 回收 → pending</text>
  <text x="760" y="568" font-size="12.5" fill="#37474F">重试：next_attempt_at 到期 → 重新进入 pending</text>
</svg>
