<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif">
  <rect x="0" y="0" width="1000" height="840" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- ============ Layer 1: Clients ============ -->
  <rect x="40" y="20" width="920" height="110" rx="12" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
  <text x="62" y="50" font-size="18" font-weight="bold" fill="#0D47A1">Clients</text>

  <rect x="55" y="64" width="280" height="50" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="195" y="94" font-size="15" text-anchor="middle" fill="#1565C0">Java SDK</text>

  <rect x="360" y="64" width="280" height="50" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="500" y="94" font-size="15" text-anchor="middle" fill="#1565C0">Python SDK</text>

  <rect x="665" y="64" width="280" height="50" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="805" y="94" font-size="15" text-anchor="middle" fill="#1565C0">MQTT 3.1.1 客户端</text>

  <!-- connectors -->
  <line x1="195" y1="130" x2="195" y2="172" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="130" x2="500" y2="172" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="805" y1="130" x2="805" y2="172" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="156" font-size="13" text-anchor="middle" fill="#455A64">gRPC</text>
  <text x="500" y="156" font-size="13" text-anchor="middle" fill="#455A64">gRPC / HTTP</text>
  <text x="805" y="156" font-size="13" text-anchor="middle" fill="#455A64">MQTT (TCP/WS)</text>

  <!-- ============ Layer 2: Ingress ============ -->
  <rect x="40" y="175" width="920" height="120" rx="12" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="62" y="205" font-size="18" font-weight="bold" fill="#1B5E20">接入层 (Ingress)</text>

  <rect x="55" y="220" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="195" y="243" font-size="14" text-anchor="middle" fill="#2E7D32">tonic gRPC Server</text>
  <text x="195" y="265" font-size="12" text-anchor="middle" fill="#558B2F">(MessageQueue / CacheService)</text>

  <rect x="360" y="220" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="500" y="243" font-size="14" text-anchor="middle" fill="#2E7D32">axum HTTP Status</text>
  <text x="500" y="265" font-size="12" text-anchor="middle" fill="#558B2F">(dashboard + APIs)</text>

  <rect x="665" y="220" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="805" y="243" font-size="14" text-anchor="middle" fill="#2E7D32">mqtt module</text>
  <text x="805" y="265" font-size="12" text-anchor="middle" fill="#558B2F">(codec / session)</text>

  <line x1="500" y1="295" x2="500" y2="328" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Layer 3: Core ============ -->
  <rect x="40" y="330" width="920" height="150" rx="12" fill="#FFF3E0" stroke="#FB8C00" stroke-width="2"/>
  <text x="62" y="360" font-size="18" font-weight="bold" fill="#E65100">核心逻辑层 (Core)</text>

  <text x="62" y="393" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#4E342E">delivery::ingest / fanout_ephemeral / run_subscribe_loop</text>
  <text x="62" y="419" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#4E342E">subscribers::TopicSubscribers (内存订阅表)</text>
  <text x="62" y="445" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#4E342E">subscribers::InflightAcks (in-flight 消息 ack 等待表)</text>
  <text x="62" y="471" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#4E342E">topic::filter_matches (MQTT +/# 主题匹配)</text>

  <line x1="500" y1="480" x2="500" y2="513" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Layer 4: Storage ============ -->
  <rect x="40" y="515" width="920" height="130" rx="12" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/>
  <text x="62" y="545" font-size="18" font-weight="bold" fill="#4A148C">存储层 (Storage)</text>

  <text x="62" y="578" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#3E2723">db::Database (SqlitePool, WAL) — messages / consumers / topic_stats / sys_lock</text>
  <text x="62" y="604" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#3E2723">cache::CacheStore (Arc&lt;Mutex&lt;HashMap&gt;&gt;, 内存 + TTL + LRU)</text>
  <text x="62" y="630" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#3E2723">cache::LockStore (SQLite sys_lock)</text>

  <line x1="500" y1="645" x2="500" y2="678" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Layer 5: Background tasks ============ -->
  <rect x="40" y="680" width="920" height="140" rx="12" fill="#ECEFF1" stroke="#607D8B" stroke-width="2"/>
  <text x="62" y="710" font-size="18" font-weight="bold" fill="#263238">后台任务 (Background tasks)</text>

  <text x="62" y="743" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#37474F">dispatch_loop (persistent 主题无在线流时 HTTP 回退)</text>
  <text x="62" y="769" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#37474F">retention_loop (过期消息 / 消费者 / 缓存 / 锁 清理)</text>
  <text x="62" y="795" font-size="14" font-family="'Noto Sans Mono CJK SC','Noto Sans Mono',monospace" fill="#37474F">subscribe loops (每订阅一条，负责 claim → 投递 → ack)</text>
</svg>
