name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IMAGE: docker.io/mapway/cangling-broker
  HARBOR_IMAGE: harbor.cangling.cn:22002/cangling/cangling-broker

permissions:
  contents: read
  actions: write

jobs:
  java:
    name: compile java client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package cn.mapway.broker
        run: mvn -f java/pom.xml -B -q package -DskipTests

  python:
    name: compile python client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stubs and package
        run: |
          python -m pip install -q -e "python[dev]"
          python python/generate_proto.py
          python -c "from cangling_broker import SatwayClient, SubscribeOptions"

  pypi:
    name: publish python to pypi
    runs-on: ubuntu-latest
    needs: python
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        working-directory: python
        run: |
          python -m pip install -q build "grpcio-tools>=1.83.0"
          python generate_proto.py
          python -m build
      - name: Upload to Official PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: python/dist/

  maven-central:
    name: publish java to maven central
    runs-on: ubuntu-latest
    needs: java
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy cn.mapway:cangling-broker
        run: mvn -f java/pom.xml -B -Prelease deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  build:
    name: compile (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-latest
            docker_arch: amd64
          - name: aarch64
            os: ubuntu-24.04-arm
            docker_arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}-release
          cache-on-failure: true
      - name: Compile broker
        run: cargo build --release --locked --bin cangling-broker
      - name: Compile receiver example
        run: cargo build --release --locked --example receiver
      - name: Upload broker binary
        uses: actions/upload-artifact@v5
        with:
          name: broker-${{ matrix.docker_arch }}
          path: target/release/cangling-broker
          if-no-files-found: error
          retention-days: 3

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5
      - name: Read crate version
        id: meta
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Layout binaries for TARGETARCH
        run: |
          mkdir -p binaries/amd64 binaries/arm64
          cp artifacts/broker-amd64/cangling-broker binaries/amd64/
          cp artifacts/broker-arm64/cangling-broker binaries/arm64/
          chmod +x binaries/amd64/cangling-broker binaries/arm64/cangling-broker
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: harbor.cangling.cn:22002
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.HARBOR_IMAGE }}:latest
            ${{ env.HARBOR_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.HARBOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=cangling-broker-image
          cache-to: type=gha,mode=max,scope=cangling-broker-image
